<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Monitor · 投研档案库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:           #f7f6f1;
      --surface:      #ffffff;
      --surface-2:    #f0efe8;
      --border:       #e2e0d6;
      --text:         #18170f;
      --text-2:       #5a5849;
      --text-3:       #9b9888;
      --accent:       #185FA5;
      --accent-bg:    #e8f1fb;
      --stocks-bg:    #e8f1fb;
      --stocks-fg:    #0d4a8a;
      --dives-bg:     #ede8fb;
      --dives-fg:     #4a2d8a;
      --radius:       12px;
      --radius-sm:    7px;
      --shadow:       0 1px 2px rgba(0,0,0,.04), 0 3px 10px rgba(0,0,0,.06);
      --shadow-hover: 0 4px 6px rgba(0,0,0,.06), 0 10px 28px rgba(0,0,0,.1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      background: var(--text);
      color: #fff;
      padding: 52px 32px 40px;
    }
    .header-inner {
      max-width: 1160px;
      margin: 0 auto;
    }
    .header-eyebrow {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
      margin-bottom: 10px;
    }
    .header-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 400;
      letter-spacing: -.02em;
      line-height: 1.1;
    }
    .header-title span {
      display: block;
      font-size: .48em;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      letter-spacing: .01em;
      color: rgba(255,255,255,.5);
      margin-top: 6px;
    }
    .header-stats {
      display: flex;
      gap: 28px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-num {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      font-weight: 400;
      color: #fff;
      line-height: 1;
    }
    .stat-label {
      font-size: 10px;
      color: rgba(255,255,255,.4);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .stat-divider {
      width: 1px;
      background: rgba(255,255,255,.12);
      align-self: stretch;
    }

    /* ── Filter bar ── */
    .filter-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247,246,241,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 32px;
    }
    .filter-inner {
      max-width: 1160px;
      margin: 0 auto;
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid var(--border);
      background: transparent;
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all .14s ease;
      color: var(--text-2);
      white-space: nowrap;
    }
    .pill:hover { border-color: var(--text); color: var(--text); background: var(--surface-2); }
    .pill.active { background: var(--text); color: #fff; border-color: var(--text); }
    .pill-count {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      opacity: .65;
    }
    .pill.active .pill-count { opacity: .7; }
    .filter-right {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-3);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Grid ── */
    .main {
      max-width: 1160px;
      margin: 0 auto;
      padding: 28px 32px 80px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 14px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px 14px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: var(--shadow);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(24,95,165,.3);
    }
    .card.hidden { display: none; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .cat-pill {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      border-radius: var(--radius-sm);
      padding: 3px 8px;
    }
    .cat-stocks    { background: var(--stocks-bg); color: var(--stocks-fg); }
    .cat-deep-dives { background: var(--dives-bg);  color: var(--dives-fg); }

    .card-date {
      font-size: 11px;
      color: var(--text-3);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }
    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 16.5px;
      font-weight: 400;
      line-height: 1.38;
      color: var(--text);
    }
    .card-summary {
      font-size: 12.5px;
      color: var(--text-2);
      line-height: 1.68;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-file {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-3);
      border-top: 1px solid var(--border);
      padding-top: 9px;
      margin-top: 3px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 0;
      color: var(--text-3);
      font-size: 14px;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 20px 32px;
      font-size: 11px;
      color: var(--text-3);
      font-family: 'JetBrains Mono', monospace;
      border-top: 1px solid var(--border);
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .header { padding: 36px 20px 28px; }
      .filter-bar { padding: 10px 20px; }
      .main { padding: 20px 16px 60px; }
      .grid { grid-template-columns: 1fr; }
      .header-stats { gap: 16px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-eyebrow">Personal Research Archive · 个人投研档案库</div>
    <h1 class="header-title">
      Market Monitor
      <span>投研档案库</span>
    </h1>
    <div class="header-stats">
      <div class="stat">
        <div class="stat-num">0</div>
        <div class="stat-label">Total Reports</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat"><div class="stat-num">0</div><div class="stat-label">Stock Reports</div></div><div class="stat"><div class="stat-num">0</div><div class="stat-label">Deep Dives</div></div><div class="stat"><div class="stat-num">0</div><div class="stat-label">Market Reports</div></div>
    </div>
  </div>
</header>

<nav class="filter-bar">
  <div class="filter-inner">
    <button class="pill pill-all active" data-filter="all">All · 全部 <span class="pill-count">0</span></button>
    <button class="pill" data-filter="stocks">📈 Stock Reports · 个股分析 <span class="pill-count">0</span></button>
    <button class="pill" data-filter="deep-dives">🔍 Deep Dives · 专题深度 <span class="pill-count">0</span></button>
    <button class="pill" data-filter="market">📊 Market Reports · 市场报告 <span class="pill-count">0</span></button>
    <span class="filter-right" id="visible-count">0 reports</span>
  </div>
</nav>

<main class="main">
  <div class="grid" id="card-grid">
        <div class="empty-state">No reports yet. Add HTML files to stocks/ or deep-dives/ and run the script again.</div>
  </div>
</main>

<footer class="footer">
  Last updated: 2026-05-12 14:18 · Auto-generated by build_index.py
</footer>

<script>
  const pills = document.querySelectorAll('.pill');
  const cards = document.querySelectorAll('.card');
  const countEl = document.getElementById('visible-count');

  pills.forEach(pill => {
    pill.addEventListener('click', () => {
      pills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      const filter = pill.dataset.filter;
      let visible = 0;
      cards.forEach(card => {
        const hide = filter !== 'all' && card.dataset.cat !== filter;
        card.classList.toggle('hidden', hide);
        if (!hide) visible++;
      });
      countEl.textContent = visible + ' reports';
    });
  });
</script>
</body>
</html>
