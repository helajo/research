<title>Before You Fork</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a field guide / pre-flight checklist. A navy instrument bar on toned paper; each section has a left margin
   rail (running order + eyebrow in mono) and a ~70ch content column; cards only for question cards, prompts and the
   scorer. Amber is the one warning accent; severity colours always carry their word and a 4-step meter. */
:root {
  --paper: #eceee8;
  --surface: #f7f8f4;
  --sunk: #e1e4dc;
  --ink: #152238;
  --ink-2: #44506a;
  --ink-3: #566073;
  --rule: #c5cac0;
  --rule-strong: #152238;
  --bar: #152238;
  --bar-ink: #e9edf4;
  --bar-ink-2: #a3b2c9;
  --bar-line: #2c3d5a;
  --amber: #995800;
  --amber-bg: #faeacc;
  --amber-line: #d9961e;
  --link: #1c4a8a;
  --ok: #1b6743;
  --ok-bg: #d7ebdd;
  --low: #21578a;
  --low-bg: #d9e6f2;
  --med: #8a4f00;
  --med-bg: #f6e2bd;
  --high: #a01c1c;
  --high-bg: #f4d7d3;
  --nc: #565f72;
  --nc-bg: #dfe2e7;
  --code-bg: #e0e4dc;
  --focus: #d48a0c;
  --font-text: "IBM Plex Sans", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-zh: "Noto Sans SC", "IBM Plex Sans", system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans SC", monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --bar-h: 92px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1522; --surface: #151f30; --sunk: #0a1019; --ink: #e3e8f0; --ink-2: #aab4c6; --ink-3: #8a95a8;
    --rule: #2a3649; --rule-strong: #c9d2e0; --bar: #081019; --bar-ink: #e3e8f0; --bar-ink-2: #8e9db5; --bar-line: #1f2b3e;
    --amber: #f2b552; --amber-bg: #33240e; --amber-line: #b8811f; --link: #93bdf2;
    --ok: #79d4a3; --ok-bg: #0f2c1f; --low: #92bdee; --low-bg: #132941; --med: #f2b552; --med-bg: #33240e;
    --high: #f5958d; --high-bg: #3a1614; --nc: #aab4c6; --nc-bg: #1e2839; --code-bg: #1b2537; --focus: #f2b552;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1522; --surface: #151f30; --sunk: #0a1019; --ink: #e3e8f0; --ink-2: #aab4c6; --ink-3: #8a95a8;
  --rule: #2a3649; --rule-strong: #c9d2e0; --bar: #081019; --bar-ink: #e3e8f0; --bar-ink-2: #8e9db5; --bar-line: #1f2b3e;
  --amber: #f2b552; --amber-bg: #33240e; --amber-line: #b8811f; --link: #93bdf2;
  --ok: #79d4a3; --ok-bg: #0f2c1f; --low: #92bdee; --low-bg: #132941; --med: #f2b552; --med-bg: #33240e;
  --high: #f5958d; --high-bg: #3a1614; --nc: #aab4c6; --nc-bg: #1e2839; --code-bg: #1b2537; --focus: #f2b552;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 16px;
  line-height: 1.6;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  padding-block: 0 0;
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
  text-rendering: optimizeLegibility;
}
html[lang="zh-Hans"] body { font-family: var(--font-zh); line-height: 1.75; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar);
}
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
code {
  font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); color: var(--ink);
  padding: 0.08em 0.36em; border-radius: 3px; overflow-wrap: anywhere;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--amber-bg); color: var(--ink);
  padding: 8px 12px; border: 2px solid var(--amber-line); font-weight: 600;
}
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 8px); }
.mono { font-family: var(--font-mono); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--bar-line);
}
.bar-in { max-width: 1160px; margin-inline: auto; display: grid; gap: 2px; padding-block: 8px 0; }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.brand {
  display: inline-flex; align-items: baseline; gap: 10px; min-width: 0; color: var(--bar-ink); text-decoration: none;
  font-weight: 600; font-size: 16px; letter-spacing: 0.01em;
}
.brand-tag {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--bar-ink-2); letter-spacing: 0.06em;
  white-space: nowrap;
}
@media (max-width: 520px) { .brand-tag { display: none; } }
.brand-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang { display: inline-flex; flex: none; border: 1px solid var(--bar-line); border-radius: 4px; overflow: hidden; }
.lang button {
  font: 500 13px/1 var(--font-text); color: var(--bar-ink-2); background: transparent; border: 0; padding: 8px 12px;
  cursor: pointer; min-height: 32px;
}
.lang button + button { border-left: 1px solid var(--bar-line); }
.lang button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); }
.lang button:focus-visible { outline-offset: -3px; }
.nav { min-width: 0; }
.nav ul {
  list-style: none; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; padding-block: 4px 6px;
  -webkit-overflow-scrolling: touch;
}
.nav a {
  display: block; white-space: nowrap; color: var(--bar-ink-2); text-decoration: none; font-size: 13px;
  padding: 5px 9px; border-radius: 3px;
}
.nav a:hover { color: var(--bar-ink); background: var(--bar-line); }
.nav a[aria-current="true"] { color: var(--bar-ink); box-shadow: inset 0 -2px 0 var(--amber-line); }
.nav a:focus-visible { outline-offset: -2px; }

/* ---------- page frame ---------- */
/* single-column grids: the one track may shrink below its content, so long words wrap or scroll inside */
.body, .hero-main, .qlist, .qcard, .qcheck, .lh, .subs, .sub, .prompts, .prompt, .sc-form, .sc-notes, .ck, .phase, .src-group,
.incident, .placard, .ev, .vbox, .caution, .field, .rate { grid-template-columns: minmax(0, 1fr); }
main { max-width: 1160px; margin-inline: auto; display: grid; }
main:focus { outline: none; }
.sec {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px 48px; padding-block: 56px;
  border-top: 1px solid var(--rule); scroll-margin-top: calc(var(--bar-h) + 8px);
}
.rail { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.idx { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }
.eyebrow {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--amber);
}
.body { display: grid; gap: 22px; min-width: 0; align-content: start; }
.body > h2 { font-size: clamp(26px, 3.2vw, 34px); font-weight: 700; letter-spacing: -0.01em; max-width: 30ch; }
html[lang="zh-Hans"] .body > h2 { letter-spacing: 0; max-width: 24em; }
.lead { font-size: 18px; color: var(--ink-2); max-width: 68ch; line-height: 1.55; }
.prose { max-width: 70ch; }
@media (min-width: 1000px) {
  .sec { grid-template-columns: 168px minmax(0, 1fr); }
  .rail { flex-direction: column; gap: 6px; position: sticky; top: calc(var(--bar-h) + 28px); align-self: start; }
}
h3.sub-t { font-size: 21px; font-weight: 650; }
.label {
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--ink-3);
}

/* ---------- hero ---------- */
.hero {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; padding-block: 48px 56px;
  scroll-margin-top: calc(var(--bar-h) + 8px);
}
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 56px; padding-block: 72px 64px; } }
.hero-main { display: grid; gap: 18px; align-content: start; min-width: 0; }
.hero h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; max-width: 18ch; }
html[lang="zh-Hans"] .hero h1 { letter-spacing: 0; line-height: 1.25; max-width: 14em; }
.hero-sub { font-size: 19px; color: var(--ink); max-width: 56ch; }
.promise { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding-top: 6px; }
.promise li {
  font-family: var(--font-mono); font-size: 13px; font-weight: 500; padding: 6px 10px; border: 1px solid var(--rule-strong);
  border-radius: 3px; background: var(--surface);
}
.placard {
  border: 1.5px solid var(--rule-strong); background: var(--surface); padding: 20px; display: grid; gap: 14px;
  align-content: start; align-self: start; min-width: 0; border-radius: 4px;
}
.placard-head { font-family: var(--font-mono); font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.placard dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 14px; }
.placard dt { color: var(--ink-3); font-family: var(--font-mono); font-size: 12px; padding-top: 2px; }
.placard dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.placard p { font-size: 14.5px; color: var(--ink-2); }
.note-amber {
  background: var(--amber-bg); border: 1px solid var(--amber-line); padding: 10px 12px; border-radius: 3px;
  color: var(--ink) !important;
}
.note-amber .label, .caution .label { color: var(--amber); display: block; margin-bottom: 2px; }

/* ---------- pills / meters ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em; padding: 3px 9px 3px 7px; border-radius: 999px; border: 1px solid currentColor;
  white-space: nowrap; line-height: 1.4; vertical-align: middle;
}
.meter { display: inline-flex; gap: 2px; align-items: flex-end; }
.meter i { display: block; width: 3px; background: currentColor; opacity: 0.22; border-radius: 1px; }
.meter i:nth-child(1) { height: 5px; } .meter i:nth-child(2) { height: 7px; }
.meter i:nth-child(3) { height: 9px; } .meter i:nth-child(4) { height: 11px; }
.lvl-1 i:nth-child(-n+1), .lvl-2 i:nth-child(-n+2), .lvl-3 i:nth-child(-n+3), .lvl-4 i:nth-child(-n+4) { opacity: 1; }
.sev-ok { color: var(--ok); background: var(--ok-bg); }
.sev-low { color: var(--low); background: var(--low-bg); }
.sev-medium { color: var(--med); background: var(--med-bg); }
.sev-high { color: var(--high); background: var(--high-bg); }
.sev-not_checked { color: var(--nc); background: var(--nc-bg); }

/* ---------- why: stages ---------- */
.stages { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; list-style: none; }
.stage {
  display: grid; gap: 8px; align-content: start; padding: 14px 16px; border: 1px solid var(--rule); background: var(--surface);
  border-radius: 4px; min-width: 0;
}
.stage-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.stage-n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.stage h3 { font-size: 18px; font-weight: 650; }
.stage p { font-size: 14.5px; color: var(--ink-2); }
.gate {
  display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-mono); font-size: 12px;
  font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber);
  border: 1.5px dashed var(--amber-line); background: var(--amber-bg); border-radius: 4px; padding: 8px 10px; text-align: center;
}
@media (min-width: 820px) {
  .stages { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 92px minmax(0, 1fr) minmax(0, 1fr); }
  .gate { writing-mode: horizontal-tb; flex-direction: column; padding: 10px 6px; }
}
.why-note { border-left: 3px solid var(--amber-line); padding: 4px 0 4px 14px; max-width: 68ch; font-weight: 500; }

/* ---------- incidents ---------- */
.incidents { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 760px) { .incidents { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.incident {
  border-top: 2px solid var(--rule-strong); padding-top: 14px; display: grid; gap: 10px; align-content: start; min-width: 0;
}
.inc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.inc-name { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.inc-date { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.incident h3 { font-size: 19px; font-weight: 650; }
.incident p { font-size: 15px; }
.lesson { background: var(--sunk); padding: 10px 12px; border-radius: 3px; }
.lesson .label { display: block; margin-bottom: 2px; }
.mini-links { list-style: none; display: grid; gap: 4px; font-size: 13px; }
.mini-links li { overflow-wrap: anywhere; }
.pub { color: var(--ink-3); }

/* ---------- question cards ---------- */
.qlist { display: grid; gap: 20px; }
.qcard {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; display: grid; gap: 18px;
  min-width: 0; scroll-margin-top: calc(var(--bar-h) + 12px);
}
.qhead { display: grid; gap: 6px; }
.qhead h3 { font-size: 22px; font-weight: 700; }
.qnum { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }
.qgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 860px) { .qgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 28px; } }
.qcheck { margin: 0; display: grid; gap: 12px; align-content: start; }
.qcheck dt { margin-bottom: -10px; }
.qcheck dd { margin: 0; font-size: 15px; }
.lh {
  border: 1px dashed var(--ink-3); border-radius: 4px; padding: 14px 16px; display: grid; gap: 12px; align-content: start;
  min-width: 0; background: var(--paper);
}
.lh-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.lh-label { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
.lh > p { font-size: 15px; }
html[lang="zh-Hans"] .lh-label { text-transform: none; letter-spacing: 0.02em; }
.lh .reason { color: var(--ink-2); }
.evidence { list-style: none; display: grid; gap: 6px; font-size: 13.5px; }
.evidence li { display: grid; gap: 1px; min-width: 0; }
.evidence code { font-size: 12.5px; }
.evidence .ev-note { color: var(--ink-2); overflow-wrap: anywhere; }
pre.code {
  margin: 0; background: var(--code-bg); border-radius: 4px; padding: 10px 12px; overflow-x: auto; font-size: 13px;
  font-family: var(--font-mono); line-height: 1.5; max-width: 100%;
}
pre.code code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; white-space: pre; }
.takeaway {
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 12px;
  font-weight: 600;
}
.takeaway .label { color: var(--amber); }
.takeaway span:last-child { min-width: 0; flex: 1 1 24ch; }

details > summary {
  cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--link); list-style: none; display: inline-flex;
  align-items: center; gap: 8px; padding-block: 2px;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before {
  content: ""; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent;
  border-bottom: 4px solid transparent; flex: none;
}
@media (prefers-reduced-motion: no-preference) { details > summary::before { transition: transform 0.15s; } }
details[open] > summary::before { transform: rotate(90deg); }
.count { color: var(--ink-3); font-family: var(--font-mono); font-size: 12px; }
.srcs ul { margin-top: 8px; }
.src-list { list-style: none; display: grid; gap: 8px; font-size: 14px; }
.src-list li { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.src-meta { font-size: 12.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.badge-unc {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--amber); border: 1px solid var(--amber-line);
  background: var(--amber-bg); padding: 1px 6px; border-radius: 3px;
}

/* tables */
.table-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--rule); }
tr:last-child > td { border-bottom: 0; }
th {
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-3); background: var(--sunk); white-space: nowrap;
}
.adv-wrap { max-height: 360px; overflow: auto; margin-top: 10px; }
.adv-wrap table { min-width: 720px; font-size: 13px; }
.adv-wrap th { position: sticky; top: 0; z-index: 1; }
.adv-wrap td:nth-child(-n+5) { white-space: nowrap; font-family: var(--font-mono); font-size: 12px; }
.c-n { width: 3em; font-family: var(--font-mono); color: var(--ink-3); }
.c-where { font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.rtable td { min-width: 0; }
.rtable td .code { margin-top: 8px; }
@media (max-width: 680px) {
  .rwrap { border: 0; background: transparent; overflow: visible; }
  .rtable, .rtable tbody, .rtable tr, .rtable td { display: block; width: 100%; }
  .rtable thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .rtable tr { border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); padding: 6px 0; }
  .rtable tr + tr { margin-top: 10px; }
  .rtable td { border: 0; padding: 6px 12px; }
  .rtable td::before {
    content: attr(data-label); display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px;
  }
  .rtable td.c-first { font-weight: 600; }
  .rtable td.c-first::before { display: none; }
}

/* ---------- connect ---------- */
.subs { display: grid; gap: 44px; }
.sub { display: grid; gap: 16px; min-width: 0; scroll-margin-top: calc(var(--bar-h) + 12px); }
.sub-head { display: flex; gap: 12px; align-items: baseline; }
.sub-head .idx { flex: none; }
.rules { list-style: none; display: grid; border-top: 1px solid var(--rule-strong); }
.rules li {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px 24px; padding-block: 11px; border-bottom: 1px solid var(--rule);
}
@media (min-width: 760px) { .rules li { grid-template-columns: minmax(0, 15em) minmax(0, 1fr); } }
.rules .rule-t { font-weight: 650; }
.rules p:last-child { font-size: 15px; color: var(--ink-2); }

/* ---------- sentinel ---------- */
.prompts { display: grid; gap: 16px; }
.prompt {

  window.addEventListener("resize", function () { setBarVar(); markCurrent(); });

  render();
})();
</script>
