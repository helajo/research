次，仅在复刻中运行，具有写入权限"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/.github/workflows/sync.yml#L1-L30"},{"file":".github/workflows/","line":null,"note":{"en":"32 workflow files","zh":"32个工作流文件"},"url":"https://github.com/lobehub/lobehub/tree/f6f0de5d7dee51c495602b731e90e2ece47354bf/.github/workflows"}]},"sources":[{"title":{"en":"Local System tool manifest at the checked commit","zh":"已检查提交中的本地系统（Local System）工具清单"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/packages/builtin-tool-local-system/src/manifest.ts","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":".github/workflows/sync.yml (Upstream Sync) at the checked commit","zh":"已检查提交中的 .github/workflows/sync.yml（Upstream Sync）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/.github/workflows/sync.yml","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"LobeHub docs: Connectors","zh":"LobeHub文档：Connectors（连接器）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docs/usage/agent/connectors.mdx","publisher":"LobeHub (repository docs)","date":"2026-11-11","accessed":"2026-11-14"},{"title":{"en":"LobeHub docs: MCP Marketplace","zh":"LobeHub文档：MCP Marketplace（MCP市场）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docs/usage/community/mcp-market.mdx","publisher":"LobeHub (repository docs)","date":"2026-11-11","accessed":"2026-11-14"},{"title":{"en":"Model Context Protocol: Security Best Practices","zh":"模型上下文协议（MCP）：安全最佳实践"},"url":"https://modelcontextprotocol.io/specification/2025-06-18/basic/security_best_practices","publisher":"Model Context Protocol","date":"2025-06-18","accessed":"2026-11-14"},{"title":{"en":"GHSA-4gpc-rhpj-9443: Cross-site scripting (XSS) escalates to remote code execution (RCE)","zh":"GHSA-4gpc-rhpj-9443：跨站脚本（XSS）升级为远程代码执行（RCE）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-4gpc-rhpj-9443","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2026-01-17","accessed":"2026-11-14"},{"title":{"en":"GHSA-m79r-r765-5f9j: Remote code execution via XSS in chat messages (desktop)","zh":"GHSA-m79r-r765-5f9j：聊天消息中的XSS导致远程代码执行（桌面版）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-m79r-r765-5f9j","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2025-09-18","accessed":"2026-11-14"},{"title":{"en":"GHSA-xq4x-622m-q8fq: Cross-site scripting (XSS) escalates to remote code execution (RCE)","zh":"GHSA-xq4x-622m-q8fq：跨站脚本（XSS）升级为远程代码执行（RCE）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-xq4x-622m-q8fq","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2026-04-27","accessed":"2026-11-14"}]}],"connect":{"api_keys":{"title":{"en":"API keys: treat them like credit cards, one per shop, each with a limit","zh":"API密钥：像信用卡一样管理，一店一卡，每张都设限额"},"items":[{"title":{"en":"One key per tool","zh":"一个工具一把密钥"},"text":{"en":"A separate key for each app, script, environment and teammate. If one leaks, you revoke only that one. Anthropic advises separate keys for development, testing and production; OpenAI advises separate projects for staging and production.","zh":"每个应用、脚本、环境和同事各用一把密钥。一把泄露，只需撤销那一把。Anthropic建议开发、测试和生产环境分别使用不同的密钥；OpenAI建议预发布环境和生产环境使用不同的项目。"}},{"title":{"en":"Set a hard spending limit","zh":"设置硬性消费上限"},"text":{"en":"An alert only notifies you; a hard limit stops requests. In OpenAI, turn on \"Enforce a hard limit\"; spending can still run slightly over before it takes effect. In the Claude Console, give each app its own workspace with a spend limit: the Default Workspace cannot take one.","zh":"提醒只会通知你，硬性上限才会拒绝请求。在OpenAI中要打开“Enforce a hard limit”（强制执行硬性上限）；生效前实际花费仍可能略超上限。在Claude Console中，为每个应用单独建一个工作区并设置消费上限：默认工作区（Default Workspace）无法设置上限。"}},{"title":{"en":"Grant the least access","zh":"只给最小权限"},"text":{"en":"Give each key an expiry date and the narrowest permission that works. A Claude key scoped to one workspace can only reach that workspace. OpenAI's help page describes restricted and read-only keys; we could not open that page directly, so check the current options.","zh":"为每把密钥设置到期日，并只给够用的最小权限。限定在某个工作区的Claude密钥只能访问该工作区。OpenAI帮助页面介绍了受限和只读密钥；我们无法直接打开该页面，请以当前实际选项为准。"}},{"title":{"en":"Never in chat or code","zh":"不放进聊天，也不写进代码"},"text":{"en":"No keys in chats, AI prompts, screenshots, emails, tickets or code. Keep them in an environment variable or a secret manager and list .env in .gitignore. In LobeHub, enter keys in the connector's authentication settings, not in the chat.","zh":"不要把密钥放进聊天、AI提示词、截图、邮件、工单或代码。把密钥保存在环境变量或密钥管理工具中，并把 .env 加入 .gitignore。在LobeHub中，请在连接器的认证设置里填写密钥，不要在聊天中输入。"}},{"title":{"en":"Revoke when leaked","zh":"泄露后立即撤销"},"text":{"en":"If a key appears anywhere it should not, revoke it first and make a new one. Deleting the message, file or commit does not help: copies stay in forks, clones and cached pages. GitHub scans public repositories for Claude and OpenAI keys and tells the provider; Anthropic deactivates an exposed Claude key automatically and emails you.","zh":"密钥一旦出现在不该出现的地方，先撤销，再新建一把。删除消息、文件或提交都无济于事：复刻、克隆和缓存页面里仍有副本。GitHub会扫描公开代码仓库中的Claude和OpenAI密钥并通知服务商；Anthropic会自动停用泄露的Claude密钥，并发邮件通知你。"}}],"steps":[{"action":{"en":"Set an OpenAI organisation hard spending limit","zh":"设置OpenAI组织级硬性消费上限"},"where":{"en":"platform.openai.com/settings/organization/limits → Spend → Edit spend limit → Monthly spend limit → turn on \"Enforce a hard limit\" → Save","zh":"platform.openai.com/settings/organization/limits → Spend → Edit spend limit → Monthly spend limit → 打开“Enforce a hard limit” → Save"},"why":{"en":"Without \"Enforce a hard limit\" it is only an alert, and a leaked key could keep spending.","zh":"不打开“Enforce a hard limit”就只是提醒，泄露的密钥可以继续花钱。"}},{"action":{"en":"Set a smaller OpenAI hard limit for each project","zh":"为每个OpenAI项目设置更低的硬性上限"},"where":{"en":"Project settings → Limits → Spend → Edit spend limit → Enforce a hard limit → Save","zh":"Project settings → Limits → Spend → Edit spend limit → Enforce a hard limit → Save"},"why":{"en":"Caps the damage from one project's key.","zh":"限制单个项目密钥可能造成的损失。"}},{"action":{"en":"Create OpenAI keys per project, with an expiry date","zh":"按项目创建OpenAI密钥，并设置到期日"},"where":{"en":"platform.openai.com/settings/organization/api-keys","zh":"platform.openai.com/settings/organization/api-keys"},"why":{"en":"Smallest blast radius; expired keys stop working on their own.","zh":"影响范围最小；过期的密钥会自动失效。"}},{"action":{"en":"Create a separate Claude workspace per app and set its spend limit and alerts","zh":"为每个应用单独创建Claude工作区，并设置消费上限和提醒"},"where":{"en":"platform.claude.com/settings/workspaces → Create workspace; then select the workspace → Spend limits","zh":"platform.claude.com/settings/workspaces → Create workspace；然后选中该工作区 → Spend limits"},"why":{"en":"Workspace keys can only reach that workspace. The Default Workspace cannot take a spend limit, so keep app keys out of it.","zh":"工作区密钥只能访问该工作区。默认工作区无法设置消费上限，所以不要把应用密钥放在那里。"}},{"action":{"en":"Delete (revoke) a Claude API key you suspect has leaked","zh":"删除（撤销）疑似泄露的Claude API密钥"},"where":{"en":"platform.claude.com/settings/keys → ⋯ menu next to the key → Delete API key","zh":"platform.claude.com/settings/keys → 密钥旁的 ⋯ 菜单 → Delete API key"},"why":{"en":"Revoking is the only fix. Deleting the file or commit does not stop a copied key.","zh":"撤销是唯一的补救办法。删除文件或提交无法阻止已被复制的密钥。"}},{"action":{"en":"Check that GitHub push protection for yourself is on","zh":"确认GitHub的个人推送保护已开启"},"where":{"en":"Profile picture → Settings → Code security → Push protection for yourself","zh":"头像 → Settings → Code security → Push protection for yourself"},"why":{"en":"Blocks a push to a public repository that contains a recognised secret. It is on by default; confirm nobody turned it off.","zh":"阻止把含有可识别密钥的内容推送到公开代码仓库。默认开启，请确认没有被关闭。"}},{"action":{"en":"If a key reaches GitHub, revoke or rotate it first, then clean the history","zh":"密钥一旦进入GitHub，先撤销或更换，再清理历史记录"},"where":{"en":"The provider's key page (above); then GitHub's guide \"Removing sensitive data from a repository\"","zh":"服务商的密钥页面（见上）；然后参照GitHub指南“Removing sensitive data from a repository”"},"why":{"en":"Forks, clones and cached views keep the old commit; only revoking makes the key useless.","zh":"复刻、克隆和缓存页面会保留旧提交，只有撤销才能让密钥失效。"}},{"action":{"en":"Prefer fine-grained GitHub tokens with an expiry; delete the ones you no longer use","zh":"优先使用设有到期日的细粒度GitHub令牌，删除不再使用的令牌"},"where":{"en":"Profile picture → Settings → Developer settings → Personal access tokens → Fine-grained tokens","zh":"头像 → Settings → Developer settings → Personal access tokens → Fine-grained tokens"},"why":{"en":"GitHub says to treat tokens like passwords; fine-grained tokens with an expiry limit the damage.","zh":"GitHub要求像对待密码一样对待令牌；设有到期日的细粒度令牌可以限制损失。"}},{"action":{"en":"Look at usage every week for spikes","zh":"每周查看用量，留意异常激增"},"where":{"en":"Anthropic: platform.claude.com/usage and platform.claude.com/logs. OpenAI: the usage page in platform settings.","zh":"Anthropic：platform.claude.com/usage 和 platform.claude.com/logs。OpenAI：平台设置中的用量页面。"},"why":{"en":"An early sign of a leaked key or a runaway script.","zh":"这是密钥泄露或脚本失控的早期信号。"}}],"sources":[{"title":{"en":"OpenAI API docs: Spend limits","zh":"OpenAI API文档：消费上限（Spend limits）"},"url":"https://developers.openai.com/api/docs/guides/spend-limits","publisher":"OpenAI","date":null,"accessed":"2026-11-14"},{"title":{"en":"OpenAI API docs: Production best practices","zh":"OpenAI API文档：生产环境最佳实践"},"url":"https://developers.openai.com/api/docs/guides/production-best-practices","publisher":"OpenAI","date":null,"accessed":"2026-11-14"},{"title":{"en":"OpenAI Help: Assign API Key Permissions","zh":"OpenAI帮助中心：设置API密钥权限"},"url":"https://help.openai.com/en/articles/8867743-assign-api-key-permissions","publisher":"OpenAI","date":null,"accessed":"2026-11-14","status":"unconfirmed"},{"title":{"en":"Claude Platform docs: Workspaces","zh":"Claude平台文档：工作区（Workspaces）"},"url":"https://platform.claude.com/docs/en/manage-claude/workspaces","publisher":"Anthropic","date":null,"accessed":"2026-11-14"},{"title":{"en":"Claude Help Center: API Key Best Practices","zh":"Claude帮助中心：API密钥最佳实践"},"url":"https://support.claude.com/en/articles/9767949-api-key-best-practices-keeping-your-keys-safe-and-secure","publisher":"Anthropic","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: Supported secret scanning patterns","zh":"GitHub文档：支持的密钥扫描模式"},"url":"https://docs.github.com/en/code-security/reference/secret-security/supported-secret-scanning-patterns","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: About secret scanning","zh":"GitHub文档：关于密钥扫描"},"url":"https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: About push protection","zh":"GitHub文档：关于推送保护"},"url":"https://docs.github.com/en/code-security/secret-scanning/introduction/about-push-protection","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: Removing sensitive data from a repository","zh":"GitHub文档：从代码仓库中删除敏感数据"},"url":"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: Managing your personal access tokens","zh":"GitHub文档：管理个人访问令牌"},"url":"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"LobeHub docs: MCP Marketplace","zh":"LobeHub文档：MCP Marketplace（MCP市场）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docs/usage/community/mcp-market.mdx","publisher":"LobeHub (repository docs)","date":"2026-11-11","accessed":"2026-11-14"}]},"app_permissions":{"title":{"en":"App permissions: read before you click Authorize","zh":"应用授权：点击Authorize之前先看清楚"},"items":[{"title":{"en":"Read the scope list","zh":"看清权限列表"},"text":{"en":"Before you click Authorize, read what the app asks for. Refuse write or admin access when it only needs to read. Broad grants make a stolen token more dangerous.","zh":"点击Authorize（授权）之前，先看清应用要求哪些权限。如果它只需要读取，就拒绝写入或管理员权限。授权范围越大，令牌被盗后的危害越大。"}},{"title":{"en":"Revoke at the account, not only in the tool","zh":"在账号层面撤销，而不只是在工具里关闭"},"text":{"en":"Turning a tool off inside LobeHub does not revoke its access to your account; LobeHub's docs say so. When you stop using a tool, revoke it on GitHub or Google as well.","zh":"在LobeHub里停用某个工具，并不会撤销它对你账号的访问权限，LobeHub的文档也明确说明了这一点。不再使用某个工具时，还要到GitHub或Google上撤销授权。"}},{"title":{"en":"Uninstall and de-authorise are separate","zh":"卸载和撤销授权是两回事"},"text":{"en":"On GitHub, uninstalling an app does not stop it acting for you; also revoke it under Authorized GitHub Apps. Only the person who authorised an app can revoke it; organisation owners cannot do it for you.","zh":"在GitHub上卸载应用，并不能阻止它继续代表你操作，还需要在Authorized GitHub Apps中撤销授权。只有当初授权的人才能撤销，组织所有者无法代你撤销。"}},{"title":{"en":"Check your security log","zh":"查看安全日志"},"text":{"en":"GitHub's security log lists the actions on your account from the last 90 days, including new tokens and app grants. Look at it after you connect a new tool.","zh":"GitHub安全日志列出你账号最近90天的操作，包括新建令牌和应用授权。连接新工具后请查看一遍。"}},{"title":{"en":"Google sign-ins reach mail and files","zh":"用Google登录的工具可能触及邮件和文件"},"text":{"en":"Many tools sign in with Google, and Gmail or Drive access reaches sensitive mail and files. Review it at myaccount.google.com/linkedapps. Google does not say whether removing access deletes the copy the app already holds.","zh":"许多工具用Google账号登录，而Gmail或Drive权限可以触及敏感的邮件和文件。请在 myaccount.google.com/linkedapps 查看。Google没有说明移除权限后，应用已保存的数据副本是否会被删除。"}}],"steps":[{"action":{"en":"Review and revoke GitHub OAuth apps you don't recognise or no longer use","zh":"检查并撤销不认识或不再使用的GitHub OAuth应用"},"where":{"en":"github.com/settings/applications → Authorized OAuth Apps → ⋯ → Revoke","zh":"github.com/settings/applications → Authorized OAuth Apps → ⋯ → Revoke"},"why":{"en":"Each grant is a standing key into your account.","zh":"每一项授权都是一把能长期进入你账号的钥匙。"}},{"action":{"en":"Review GitHub Apps; limit installed apps to selected repositories","zh":"检查GitHub应用，把已安装应用限定在指定代码仓库"},"where":{"en":"Settings → Applications → Authorized GitHub Apps / Installed GitHub Apps → Configure → Repository access → Only select repositories","zh":"Settings → Applications → Authorized GitHub Apps / Installed GitHub Apps → Configure → Repository access → Only select repositories"},"why":{"en":"Uninstalling and de-authorising are separate; do both for apps you drop.","zh":"卸载和撤销授权是分开的，不再使用的应用两步都要做。"}},{"action":{"en":"Scan your GitHub security log after connecting a new tool","zh":"连接新工具后查看GitHub安全日志"},"where":{"en":"Settings → Archives → Security log","zh":"Settings → Archives → Security log"},"why":{"en":"Shows token creation, app grants and logins for the last 90 days.","zh":"显示最近90天的令牌创建、应用授权和登录记录。"}},{"action":{"en":"Review and remove Google third-party access","zh":"检查并移除Google第三方访问权限"},"where":{"en":"myaccount.google.com/linkedapps → the app → See details → Remove access","zh":"myaccount.google.com/linkedapps → 选择应用 → See details → Remove access"},"why":{"en":"Gmail and Drive access reaches sensitive mail and files.","zh":"Gmail和Drive权限可以触及敏感的邮件和文件。"}},{"action":{"en":"When you stop using an AI tool, revoke it at the account too","zh":"停用AI工具时，也要在账号层面撤销授权"},"where":{"en":"The GitHub and Google pages above","zh":"上述GitHub和Google页面"},"why":{"en":"Disabling a tool inside LobeHub does not revoke the account grant.","zh":"在LobeHub中停用工具，并不会撤销账号授权。"}}],"sources":[{"title":{"en":"GitHub Docs: Reviewing your authorized OAuth apps","zh":"GitHub文档：查看已授权的OAuth应用"},"url":"https://docs.github.com/en/apps/oauth-apps/using-oauth-apps/reviewing-your-authorized-oauth-apps","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: Reviewing and revoking authorization of GitHub Apps","zh":"GitHub文档：查看和撤销GitHub应用的授权"},"url":"https://docs.github.com/en/apps/using-github-apps/reviewing-and-revoking-authorization-of-github-apps","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: Reviewing and modifying installed GitHub Apps","zh":"GitHub文档：查看和修改已安装的GitHub应用"},"url":"https://docs.github.com/en/apps/using-github-apps/reviewing-and-modifying-installed-github-apps","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: Reviewing your security log","zh":"GitHub文档：查看安全日志"},"url":"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/reviewing-your-security-log","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"Google Account Help: Manage connections between your Google Account and third parties","zh":"Google账号帮助：管理Google账号与第三方的关联"},"url":"https://support.google.com/accounts/answer/13533235","publisher":"Google","date":null,"accessed":"2026-11-14"},{"title":{"en":"LobeHub docs: Connectors","zh":"LobeHub文档：Connectors（连接器）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docs/usage/agent/connectors.mdx","publisher":"LobeHub (repository docs)","date":"2026-11-11","accessed":"2026-11-14"},{"title":{"en":"Model Context Protocol: Security Best Practices","zh":"模型上下文协议（MCP）：安全最佳实践"},"url":"https://modelcontextprotocol.io/specification/2025-06-18/basic/security_best_practices","publisher":"Model Context Protocol","date":"2025-06-18","accessed":"2026-11-14"}]},"ai_agents":{"title":{"en":"AI agents that write code and run commands","zh":"会写代码、运行命令的AI智能体"},"items":[{"title":{"en":"Keep approvals on","zh":"保持审批开启"},"text":{"en":"Claude Code starts in auto mode in interactive terminal and VS Code sessions, with a few exceptions. In auto mode a classifier reviews actions instead of you, so do not expect a prompt before every command. For an unfamiliar project, switch to Manual mode, which asks before edits, most shell commands and web access. Never use bypassPermissions on your own laptop; the docs say to use it only in isolated environments such as containers or virtual machines.","zh":"Claude Code在终端和VS Code的交互式会话中默认以自动（auto）模式启动（有少数例外）。自动模式由分类器代替你审查操作，所以不要指望每条命令执行前都会询问你。处理不熟悉的项目时，请切换到手动（Manual）模式，它会在编辑文件、运行大多数命令和访问网络之前先询问。切勿在自己的电脑上使用bypassPermissions；官方文档要求只在容器或虚拟机等隔离环境中使用。"}},{"title":{"en":"In LobeHub: Ask, not Allow","zh":"在LobeHub中：选Ask，不选Allow"},"text":{"en":"Set each new plugin (MCP) tool to Ask, and Deny the ones you don't need. LobeHub warns that not every write operation is guaranteed to ask for approval. Do not switch on auto-run.","zh":"把每个新插件（MCP）工具设为Ask（询问），用不到的设为Deny（拒绝）。LobeHub提醒：并非每个写入操作都一定会请求批准。不要开启auto-run（自动运行）。"}},{"title":{"en":"One folder, and know where it runs","zh":"只给一个文件夹，并清楚在哪里运行"},"text":{"en":"Point the agent at one project folder. In LobeHub, check the Execution Device selector: the cloud sandbox uses temporary files, while local execution changes real files on your computer. LobeHub's docs say the working directory is not an access-control boundary.","zh":"只让智能体使用一个项目文件夹。在LobeHub中，先查看执行设备（Execution Device）选择器：云沙箱使用临时文件，本地执行则会改动你电脑上的真实文件。LobeHub文档指出，工作目录并不是访问控制边界。"}},{"title":{"en":"Trusted plugins only","zh":"只用可信插件"},"text":{"en":"A local MCP server is a program that runs with your permissions; the MCP specification shows a start-up command that sends your SSH key away. Read the publisher, source, install command and tool list before you add one. Anthropic does not security-audit MCP servers, and OWASP's MCP Top 10 (in beta) lists tool poisoning, prompt injection and supply-chain attacks among the main risks.","zh":"本地MCP服务器是以你的权限运行的程序；MCP规范就举例说明了一个会把你的SSH密钥发送出去的启动命令。添加之前，请看清发布者、源代码、安装命令和工具列表。Anthropic不对MCP服务器做安全审计；OWASP的MCP十大风险（测试版）把工具投毒、提示词注入和供应链攻击列为主要风险。"}},{"title":{"en":"Read the project's instructions first","zh":"先读项目自带的指令文件"},"text":{"en":"Files such as CLAUDE.md, AGENTS.md and .mcp.json become instructions or start servers when an agent opens the folder. Read them in a cloned project first, and decline Claude Code's trust prompt if you are unsure.","zh":"CLAUDE.md、AGENTS.md、.mcp.json 等文件会在智能体打开文件夹时成为指令或启动服务器。请先在克隆的项目中阅读这些文件；如有疑问，拒绝Claude Code的信任提示。"}},{"title":{"en":"Leave Actions off on your fork","zh":"在复刻上保持Actions关闭"},"text":{"en":"A LobeHub fork with GitHub Actions on runs Upstream Sync every 6 hours and pulls in new code from the official project. Leave Actions off on forks you only read.","zh":"开启GitHub Actions的LobeHub复刻每6小时运行一次Upstream Sync，从官方项目拉取新代码。只用于阅读的复刻请保持Actions关闭。"}},{"title":{"en":"Review before you accept","zh":"接受之前先审查"},"text":{"en":"Read the changes and the command output before you accept them. Don't let an agent push or merge without your review.","zh":"接受之前，先查看改动内容和命令输出。不要让智能体未经你审查就推送或合并代码。"}}],"steps":[{"action":{"en":"Before adding an MCP server or skill, open its detail page","zh":"添加MCP服务器或技能前，先打开详情页"},"where":{"en":"LobeHub: Community → MCP → server card → Installation / Capabilities / Source Information","zh":"LobeHub：Community → MCP → 服务器卡片 → Installation / Capabilities / Source Information"},"why":{"en":"Check the publisher, source repository, install command, environment variables and tools. Poisoned tools hide in commands and descriptions.","zh":"查看发布者、源代码仓库、安装命令、环境变量和工具列表。被投毒的工具往往藏在命令和描述里。"}},{"action":{"en":"Set every new MCP tool to Ask; Deny the ones you don't need","zh":"把每个新MCP工具设为Ask，用不到的设为Deny"},"where":{"en":"LobeHub: Agent Settings → Connectors → the server → tool permissions (Allow / Ask / Deny) → Save","zh":"LobeHub：Agent Settings → Connectors → 选择服务器 → 工具权限（Allow / Ask / Deny） → Save"},"why":{"en":"Ask forces a human check before each run.","zh":"Ask会在每次运行前强制人工确认。"}},{"action":{"en":"Prefer the cloud sandbox for experiments; check where a task will run","zh":"试验时优先使用云沙箱，并确认任务在哪里运行"},"where":{"en":"LobeHub chat input: Execution Device selector","zh":"LobeHub聊天输入框：Execution Device选择器"},"why":{"en":"Local execution changes real files; the working directory is not a security boundary.","zh":"本地执行会改动真实文件；工作目录不是安全边界。"}},{"action":{"en":"Try a new connector with test data and read-only access first","zh":"先用测试数据和只读权限试用新连接器"},"where":{"en":"LobeHub MCP Marketplace tips","zh":"LobeHub MCP市场使用提示"},"why":{"en":"Limits the damage while you learn what it does.","zh":"在弄清它的作用之前，把可能的损失降到最低。"}},{"action":{"en":"In Claude Code, use Manual mode for unfamiliar projects and deny reading secret files","zh":"在Claude Code中，处理不熟悉的项目时使用手动模式，并禁止读取密钥文件"},"where":{"en":"`/permissions` in Claude Code, or .claude/settings.json: deny Read(./.env)","zh":"在Claude Code中输入 `/permissions`，或在 .claude/settings.json 中设置拒绝 Read(./.env)"},"why":{"en":"Claude Code itself enforces permission rules; they do not depend on the model choosing to obey.","zh":"权限规则由Claude Code程序本身强制执行，不依赖模型是否自觉遵守。"}},{"action":{"en":"Never use bypassPermissions on your own laptop","zh":"切勿在自己的电脑上使用bypassPermissions"},"where":{"en":"Claude Code permission modes","zh":"Claude Code权限模式"},"why":{"en":"The docs say to use it only in isolated environments such as containers or virtual machines.","zh":"官方文档要求只在容器或虚拟机等隔离环境中使用。"}},{"action":{"en":"Read CLAUDE.md, AGENTS.md and .mcp.json in any cloned project before opening an agent there","zh":"在克隆的项目中打开智能体之前，先阅读 CLAUDE.md、AGENTS.md 和 .mcp.json"},"where":{"en":"Repository root; Claude Code trust prompt","zh":"代码仓库根目录；Claude Code信任提示"},"why":{"en":"These files become instructions or start servers; a malicious project can plant them.","zh":"这些文件会成为指令或启动服务器，恶意项目可能借此埋下陷阱。"}},{"action":{"en":"Review the changes and command output before you accept","zh":"接受之前审查改动和命令输出"},"where":{"en":"Your editor, or `git diff`","zh":"你的编辑器，或 `git diff`"},"why":{"en":"LobeHub and Claude Code docs both leave the final review to you.","zh":"LobeHub和Claude Code的文档都把最终审查责任交给使用者。"}}],"sources":[{"title":{"en":"Claude Code docs: Configure permissions","zh":"Claude Code文档：配置权限"},"url":"https://code.claude.com/docs/en/permissions","publisher":"Anthropic","date":null,"accessed":"2026-11-14"},{"title":{"en":"Claude Code docs: Security","zh":"Claude Code文档：安全"},"url":"https://code.claude.com/docs/en/security","publisher":"Anthropic","date":null,"accessed":"2026-11-14"},{"title":{"en":"Model Context Protocol: Security Best Practices","zh":"模型上下文协议（MCP）：安全最佳实践"},"url":"https://modelcontextprotocol.io/specification/2025-06-18/basic/security_best_practices","publisher":"Model Context Protocol","date":"2025-06-18","accessed":"2026-11-14"},{"title":{"en":"OWASP MCP Top 10 (Phase 3 beta)","zh":"OWASP MCP十大风险（第三阶段测试版）"},"url":"https://owasp.org/www-project-mcp-top-10/","publisher":"OWASP","date":null,"accessed":"2026-11-14"},{"title":{"en":"LobeHub docs: Connectors","zh":"LobeHub文档：Connectors（连接器）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docs/usage/agent/connectors.mdx","publisher":"LobeHub (repository docs)","date":"2026-11-11","accessed":"2026-11-14"},{"title":{"en":"LobeHub docs: MCP Marketplace","zh":"LobeHub文档：MCP Marketplace（MCP市场）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docs/usage/community/mcp-market.mdx","publisher":"LobeHub (repository docs)","date":"2026-11-11","accessed":"2026-11-14"},{"title":{"en":"LobeHub docs: Execution Devices","zh":"LobeHub文档：Execution Devices（执行设备）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docs/usage/agent/execution-devices.mdx","publisher":"LobeHub (repository docs)","date":"2026-11-11","accessed":"2026-11-14"},{"title":{"en":"LobeHub docs: Cloud Sandbox","zh":"LobeHub文档：Cloud Sandbox（云沙箱）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docs/usage/agent/sandbox.mdx","publisher":"LobeHub (repository docs)","date":"2026-11-11","accessed":"2026-11-14"},{"title":{"en":"LobeHub docs: Terminal","zh":"LobeHub文档：Terminal（终端）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docs/usage/agent/terminal.mdx","publisher":"LobeHub (repository docs)","date":"2026-11-11","accessed":"2026-11-14"},{"title":{"en":".github/workflows/sync.yml (Upstream Sync) at the checked commit","zh":"已检查提交中的 .github/workflows/sync.yml（Upstream Sync）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/.github/workflows/sync.yml","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"}]},"ip_identity":{"title":{"en":"Your IP and identity: what gives you away","zh":"IP地址与身份：哪些信息会暴露你"},"headers":[{"en":"Where","zh":"在哪里"},{"en":"What strangers can see","zh":"陌生人能看到什么"},{"en":"What to do","zh":"怎么做"}],"rows":[{"where":{"en":"Every website and API you connect to","zh":"你连接的每个网站和API"},"sees":{"en":"Your IP address: your rough location and your internet provider. On its own it does not name you. Combined with other details, it can identify you.","zh":"你的IP地址：大致位置和网络服务商。IP地址本身不会透露你的姓名，但与其他信息结合后可以识别出你。"},"do":{"en":"A VPN from a provider you trust hides your IP from sites and your traffic from the café or hotel network. The VPN company sees your traffic instead, and cookies and logins still identify you: a VPN is not an anonymity tool. Free VPNs may make money from your data.","zh":"使用可信服务商的虚拟专用网络（VPN），可以向网站隐藏你的IP，并向咖啡馆或酒店网络隐藏你的流量。但VPN公司能看到你的流量，Cookie和登录状态仍然会识别出你：VPN不是匿名工具。免费VPN可能靠你的数据赚钱。"}},{"where":{"en":"Public Wi-Fi","zh":"公共Wi-Fi"},"sees":{"en":"The café or hotel network owner can see your traffic; HTTPS protects the content on most sites.","zh":"咖啡馆或酒店的网络所有者可以看到你的流量；大多数网站使用HTTPS，内容本身受到保护。"},"do":{"en":"Most sites use HTTPS, so a VPN is not needed for most public Wi-Fi risks. Confirm the exact network name, use your phone's hotspot for sensitive work, and postpone banking or finance-system logins.","zh":"大多数网站使用HTTPS，所以应对公共Wi-Fi的多数风险并不需要VPN。请确认准确的网络名称，处理敏感工作时使用手机热点，并暂缓登录网上银行或财务系统。"}},{"where":{"en":"A server or tool running on your laptop","zh":"在你电脑上运行的服务器或工具"},"sees":{"en":"Open ports. Internet search tools such as Shodan and Censys find systems with open ports, default passwords and old software.","zh":"开放的端口。Shodan、Censys等互联网搜索工具会找出开放端口、使用默认密码或软件过时的系统。"},"do":{"en":"Don't open local tools to the internet, and close ports you don't need. Bind to 127.0.0.1 or use the hosted version. A local MCP server should use stdio or require a token.","zh":"不要把本地工具开放到互联网，关闭不需要的端口。绑定到127.0.0.1，或使用托管版。本地MCP服务器应使用stdio方式，或要求令牌验证。"}},{"where":{"en":"Your GitHub commits","zh":"你的GitHub提交"},"sees":{"en":"The email address in every commit, kept in public history for good.","zh":"每个提交中的邮箱地址，会永久保留在公开历史记录中。"},"do":{"en":"Settings → Access → Emails: turn on \"Keep my email addresses private\" and \"Block command line pushes that expose my email\". Then set git to the noreply address shown there: `git config --global user.email \"ID+USERNAME@users.noreply.github.com\"`. Past commits keep the old address, so do this before your first commit.","zh":"Settings → Access → Emails：打开“Keep my email addresses private”和“Block command line pushes that expose my email”。然后把git设置为该页面显示的noreply地址：`git config --global user.email \"ID+USERNAME@users.noreply.github.com\"`。以往的提交仍保留旧地址，所以请在第一次提交之前完成设置。"},"code":"git config --global user.email \"ID+USERNAME@users.noreply.github.com\""},{"where":{"en":"Screenshots, logs and error messages","zh":"截图、日志和错误信息"},"sees":{"en":"Keys, tokens, IP addresses, internal server names, email addresses, and your user name in file paths. Photos can carry their location.","zh":"密钥、令牌、IP地址、内部服务器名称、邮箱地址，以及文件路径中的用户名。照片还可能带有拍摄位置。"},"do":{"en":"Crop or blur before sharing, remove photo location, and ask Claude to check first (with known keys removed). Logs should not record tokens, passwords or account numbers.","zh":"分享前裁剪或打码，删除照片位置信息，并先请Claude检查（先去掉已知的密钥）。日志中不应记录令牌、密码或银行账号。"}}],"sources":[{"title":{"en":"EFF Surveillance Self-Defense: Glossary, IP address","zh":"EFF《监控自卫指南》：术语表，IP地址"},"url":"https://ssd.eff.org/glossary/ip-address","publisher":"Electronic Frontier Foundation","date":null,"accessed":"2026-11-14"},{"title":{"en":"EFF SSD: Choosing the VPN That's Right for You","zh":"EFF《监控自卫指南》：如何选择适合自己的VPN"},"url":"https://ssd.eff.org/module/choosing-vpn-thats-right-you","publisher":"Electronic Frontier Foundation","date":"2026-07-28","accessed":"2026-11-14"},{"title":{"en":"EFF SSD: Why Metadata Matters","zh":"EFF《监控自卫指南》：为什么元数据很重要"},"url":"https://ssd.eff.org/module/why-metadata-matters","publisher":"Electronic Frontier Foundation","date":"2024-07-22","accessed":"2026-11-14"},{"title":{"en":"CISA: Internet Exposure Reduction Guidance","zh":"CISA：减少互联网暴露面指南"},"url":"https://www.cisa.gov/resources-tools/resources/stuff-search","publisher":"CISA","date":"2026-08-21","accessed":"2026-11-14"},{"title":{"en":"Model Context Protocol: Security Best Practices","zh":"模型上下文协议（MCP）：安全最佳实践"},"url":"https://modelcontextprotocol.io/specification/2025-06-18/basic/security_best_practices","publisher":"Model Context Protocol","date":"2025-06-18","accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: Blocking command line pushes that expose your personal email address","zh":"GitHub文档：阻止会暴露个人邮箱的命令行推送"},"url":"https://docs.github.com/en/account-and-profile/how-tos/email-preferences/blocking-command-line-pushes-that-expose-your-personal-email-address","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: Email addresses reference","zh":"GitHub文档：邮箱地址参考"},"url":"https://docs.github.com/en/account-and-profile/reference/email-addresses-reference","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: Setting your commit email address","zh":"GitHub文档：设置提交邮箱"},"url":"https://docs.github.com/en/account-and-profile/setting-up-and-managing-your-personal-account-on-github/managing-email-preferences/setting-your-commit-email-address","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"OWASP Logging Cheat Sheet","zh":"OWASP日志记录速查表"},"url":"https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html","publisher":"OWASP","date":null,"accessed":"2026-11-14"}]}},"sentinel":{"prompts":[{"id":"install","label":{"en":"1 · Before you install","zh":"1 · 安装之前"},"prompt":{"en":"Check this repository before I install it. Read files only; do not run, install or build anything. List: install scripts and what they run, download-and-run lines, secrets or default passwords in any file (including example files), ports it opens and to whom, who can sign up, and what it can do on my computer (files, commands, plugins, automations). Rate each risk OK, Low, Medium or High with a one-line reason and the file and line, and say how to prevent it.","zh":"请在我安装之前检查这个代码仓库。只阅读文件，不要运行、安装或构建任何东西。请列出：安装脚本及其运行的内容、下载后直接运行的命令、任何文件（包括示例文件）中的密钥或默认密码、它开放哪些端口以及对谁开放、谁可以注册，以及它能在我的电脑上做什么（文件、命令、插件、自动化流程）。请把每项风险评为正常、低、中或高，附一句理由以及文件名和行号，并说明如何防范。"}},{"id":"share","label":{"en":"2 · Before you share","zh":"2 · 分享之前"},"prompt":{"en":"Before I share this screenshot, log or file, check it for API keys, passwords, tokens, email addresses, IP addresses, internal server names, account numbers and personal details. List what I should remove or blur. Do not repeat any secret you find in full; show only its first few characters.","zh":"在我分享这张截图、这段日志或这个文件之前，请检查其中是否有API密钥、密码、令牌、邮箱地址、IP地址、内部服务器名称、银行账号和个人信息。请列出我应该删除或打码的内容。发现的密钥不要完整复述，只显示前几个字符。"}},{"id":"connect","label":{"en":"3 · Before you connect","zh":"3 · 连接之前"},"prompt":{"en":"This app asks for these permissions: [paste the permission list]. What could it do with them, which ones does it not need, and what is the least access that still works?","zh":"这个应用要求以下权限：[粘贴权限列表]。它能用这些权限做什么？哪些权限它其实不需要？能正常工作的最小权限是什么？"}}],"caution":{"en":"Whatever you paste goes to the AI service. First take out every key, password, account number and client name you already know about, and replace them with placeholders such as <API_KEY> or <CLIENT_A>. If a key is pasted into a chat by mistake, treat it as leaked: revoke it and make a new one, because deleting the chat does not undo it. Claude is a second pair of eyes, not a guarantee.","zh":"你粘贴的所有内容都会发送给AI服务。请先删除你已知的所有密钥、密码、银行账号和客户名称，用 <API_KEY>、<CLIENT_A> 等占位符代替。如果不小心把密钥粘贴进了聊天，请视为已泄露：立即撤销并新建一把，因为删除聊天记录并不能消除泄露。Claude只是多一双眼睛帮你把关，不能保证安全。"},"privacy_note":{"en":"On personal Claude plans (Free, Pro, Max and Ultra), Anthropic uses your chats to train new models when the model-improvement (\"Help improve\") setting is on, and keeps that data for up to 5 years; with it off, 30 days. Incognito chats are not used for training. Look for the setting under your name → Settings → Privacy. Commercial plans (Team, Enterprise and the API) are not used for training by default and keep data for 30 days as standard. Work data belongs in a plan IT has approved.","zh":"在个人版Claude（Free、Pro、Max和Ultra）中，如果“模型改进”（Help improve）设置处于开启状态，Anthropic会用你的聊天训练新模型，相关数据最长保存5年；关闭该设置则保存30天。无痕（Incognito）聊天不会用于训练。该设置位于：你的名字 → Settings → Privacy。商业版（Team、Enterprise和API）默认不用于训练，标准保存期为30天。工作数据只应在IT部门批准的方案中处理。"},"steps":[{"action":{"en":"Describe the thing, not the secret","zh":"描述情况，而不是粘贴密钥"},"where":{"en":"Any Claude chat","zh":"任何Claude对话"},"why":{"en":"Claude can review permissions, scripts and messages without ever seeing the real key.","zh":"Claude无需看到真实密钥，也能审查权限、脚本和消息。"}},{"action":{"en":"Redact before pasting","zh":"粘贴之前先脱敏"},"where":{"en":"Your text editor, before you paste","zh":"粘贴之前，在文本编辑器中处理"},"why":{"en":"Anthropic and the UK NCSC both advise against putting sensitive data into chats.","zh":"Anthropic和英国国家网络安全中心（NCSC）都建议不要把敏感数据放进聊天。"}},{"action":{"en":"If a key was pasted by mistake, revoke and replace it","zh":"如果误贴了密钥，立即撤销并更换"},"where":{"en":"The provider's key page (Anthropic: platform.claude.com/settings/keys)","zh":"服务商的密钥页面（Anthropic：platform.claude.com/settings/keys）"},"why":{"en":"Deleted chats stay in back-end storage for up to 30 days.","zh":"已删除的聊天在后台存储中最长仍会保留30天。"}},{"action":{"en":"Choose your training setting on purpose, and use an Incognito chat for one-off sensitive checks","zh":"有意识地选择训练设置；一次性的敏感检查使用无痕聊天"},"where":{"en":"claude.ai: your name → Settings → Privacy; claude.ai/settings/data-privacy-controls","zh":"claude.ai：你的名字 → Settings → Privacy；claude.ai/settings/data-privacy-controls"},"why":{"en":"With the setting on, data can be kept for up to 5 years. Incognito chats are not used for training.","zh":"开启该设置时，数据最长可保存5年。无痕聊天不会用于训练。"}},{"action":{"en":"Don't send feedback or share transcripts from sessions that touched sensitive data","zh":"涉及敏感数据的会话，不要提交反馈或分享对话记录"},"where":{"en":"Claude Code: /feedback, /bug, /share","zh":"Claude Code：/feedback、/bug、/share"},"why":{"en":"Feedback sends the whole conversation, including code, and is kept for 5 years.","zh":"反馈会发送整个对话（包括代码），并保存5年。"}}],"sources":[{"title":{"en":"Claude Code docs: Data usage","zh":"Claude Code文档：数据使用"},"url":"https://code.claude.com/docs/en/data-usage","publisher":"Anthropic","date":null,"accessed":"2026-11-14"},{"title":{"en":"Anthropic Privacy Center: How long do you store my data?","zh":"Anthropic隐私中心：我的数据会保存多久？"},"url":"https://privacy.claude.com/en/articles/10023548-how-long-do-you-store-my-data","publisher":"Anthropic","date":"2026-07-01","accessed":"2026-11-14"},{"title":{"en":"Anthropic Privacy Center: Is my data used for model training? (consumer)","zh":"Anthropic隐私中心：我的数据会用于模型训练吗？（个人版）"},"url":"https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training","publisher":"Anthropic","date":"2026-03-16","accessed":"2026-11-14"},{"title":{"en":"Anthropic Privacy Center: Is my data used for model training? (commercial)","zh":"Anthropic隐私中心：我的数据会用于模型训练吗？（商业版）"},"url":"https://privacy.claude.com/en/articles/7996868-is-my-data-used-for-model-training","publisher":"Anthropic","date":"2026-08-18","accessed":"2026-11-14"},{"title":{"en":"Anthropic Privacy Center: How do I change my model improvement privacy settings?","zh":"Anthropic隐私中心：如何更改模型改进的隐私设置？"},"url":"https://privacy.claude.com/en/articles/12109829-how-do-i-change-my-model-improvement-privacy-settings","publisher":"Anthropic","date":"2026-08-03","accessed":"2026-11-14"},{"title":{"en":"Claude Help Center: I would like to input sensitive data","zh":"Claude帮助中心：我想输入敏感数据"},"url":"https://support.claude.com/en/articles/8325621-i-would-like-to-input-sensitive-data","publisher":"Anthropic","date":null,"accessed":"2026-11-14"},{"title":{"en":"NCSC blog: ChatGPT and large language models: what's the risk?","zh":"英国国家网络安全中心博客：ChatGPT与大语言模型有哪些风险？"},"url":"https://www.ncsc.gov.uk/blog-post/chatgpt-and-large-language-models-whats-the-risk","publisher":"UK National Cyber Security Centre","date":"2023-03-14","accessed":"2026-11-14"},{"title":{"en":"Claude Help Center: API Key Best Practices","zh":"Claude帮助中心：API密钥最佳实践"},"url":"https://support.claude.com/en/articles/9767949-api-key-best-practices-keeping-your-keys-safe-and-secure","publisher":"Anthropic","date":null,"accessed":"2026-11-14"},{"title":{"en":"Claude Code docs: Security","zh":"Claude Code文档：安全"},"url":"https://code.claude.com/docs/en/security","publisher":"Anthropic","date":null,"accessed":"2026-11-14"}]},"verdict":{"headline":{"en":"Safe to clone, careful to install","zh":"可以克隆，安装须谨慎"},"rows":[{"n":1,"question":{"en":"Real project","zh":"官方项目"},"severity":"low","finding":{"en":"Genuine project; licence fields disagree; our fork is one release behind","zh":"项目真实；许可证信息不一致；我们的复刻落后一个版本"}},{"n":2,"question":{"en":"Security process","zh":"安全流程"},"severity":"low","finding":{"en":"Private reporting; 15 advisories, all fixed at or below 2.3.2","zh":"可私下报告；15条安全公告，修复版本均不高于2.3.2"}},{"n":3,"question":{"en":"Install scripts","zh":"安装脚本"},"severity":"medium","finding":{"en":"6 packages may run scripts; no lockfile for 421 direct dependencies","zh":"6个软件包可运行脚本；421个直接依赖没有锁定文件"}},{"n":4,"question":{"en":"Download-and-run","zh":"下载即运行"},"severity":"medium","finding":{"en":"`bash <(curl …)` through an unpinned short link","zh":"通过未固定版本的短链接执行 `bash <(curl …)`"}},{"n":5,"question":{"en":"Secrets in code","zh":"代码中的密钥"},"severity":"high","finding":{"en":"Real login-signing key and admin / pswd123 in a ready-made setup file; one database password for every install","zh":"现成配置文件中有真实的登录签名私钥和admin / pswd123；所有安装共用一个数据库密码"}},{"n":6,"question":{"en":"Exposed when running","zh":"运行时暴露"},"severity":"high","finding":{"en":"Database, Redis and storage open on all networks; Redis without password; open sign-up; public bucket","zh":"数据库、Redis和存储对所有网络开放；Redis无密码；开放注册；存储桶公开可读"}},{"n":7,"question":{"en":"Power on your machine","zh":"对电脑的控制能力"},"severity":"medium","finding":{"en":"Commands ask first, file changes in the folder don't; auto-run mode; 32 workflows incl. 6-hourly fork sync","zh":"运行命令前询问，文件夹内改动不询问；有自动运行模式；32个工作流，含每6小时一次的复刻同步"}}],"summary":{"en":"LobeHub is a genuine, actively maintained project with a working security process. Both High findings sit in its self-hosting Docker files: built-in secrets and passwords that must be replaced, and database ports open to every network. These findings are as of v2.3.2; check the latest release first (2.3.3 came out on 12 Nov 2026).","zh":"LobeHub是真实、持续维护的项目，安全流程运作正常。两项高风险发现都出在自行部署用的Docker文件中：必须更换的内置密钥和密码，以及对所有网络开放的数据库端口。以上结论基于v2.3.2；请先查看最新版本（v2.3.3已于 2026 年 11 月 12 日发布）。"},"recommendation":{"en":"Reading or forking the code is fine. To use LobeHub, choose the hosted app or the official desktop release, so we never run its install scripts or its database ourselves. Don't build it from source or run its Docker setup on a work laptop. In the desktop app, keep approvals on and don't use auto-run.","zh":"阅读或复刻代码没有问题。如需使用LobeHub，请选择托管版应用或官方桌面版，这样我们无需自己运行它的安装脚本和数据库。不要在工作电脑上从源代码构建，也不要运行它的Docker部署。使用桌面版时，请保持审批开启，不要使用自动运行模式。"}},"scorer":{"outcomes":{"ok":{"label":{"en":"Go ahead","zh":"可以继续"},"text":{"en":"No Medium or High risks found. Install the latest official release and keep the checklist in mind.","zh":"未发现中、高风险。请安装最新的官方版本，并对照检查清单操作。"}},"caution":{"label":{"en":"Proceed with care","zh":"谨慎推进"},"text":{"en":"Before you install on a work laptop, fix or accept each Medium risk and answer any question not yet checked.","zh":"在工作电脑上安装之前，请处理或确认接受每一项中风险，并补查尚未检查的问题。"}},"stop":{"label":{"en":"Stop","zh":"暂停"},"text":{"en":"At least one High risk. Don't install on a work laptop until it is fixed or avoided, for example by using the hosted app or an official release.","zh":"至少有一项高风险。在问题解决或规避之前（例如改用托管版应用或官方发布版本），不要在工作电脑上安装。"}},"empty":{"label":{"en":"Not rated yet","zh":"尚未评级"},"text":{"en":"Rate at least one question to see a verdict.","zh":"至少为一个问题评级后才会显示结论。"}}},"rule":{"en":"Any High → Stop. Otherwise, any Medium or any question not checked → Proceed with care. Only OK and Low → Go ahead. Nothing rated → Not rated yet.","zh":"任何一项为高 → 暂停。否则，任何一项为中或有问题未检查 → 谨慎推进。全部为正常或低 → 可以继续。全部未评级 → 尚未评级。"},"rule_logic":[{"when":"any_high","outcome":"stop"},{"when":"any_medium_or_not_checked","outcome":"caution"},{"when":"only_ok_or_low","outcome":"ok"},{"when":"all_not_checked","outcome":"empty"}],"example":{"project":"lobehub/lobehub v2.3.2","ratings":{"1":"low","2":"low","3":"medium","4":"medium","5":"high","6":"high","7":"medium"},"notes":{"en":"Example from our check of v2.3.2 on 11 Nov 2026. Version 2.3.3 came out on 12 Nov 2026; check it before installing.","zh":"示例来自我们于 2026 年 11 月 11 日对v2.3.2的检查。v2.3.3已于 2026 年 11 月 12 日发布，安装前请先检查新版本。"}},"rating_values":["not_checked","ok","low","medium","high"]},"checklist":[{"id":"official-link","n":1,"phase":"before","text":{"en":"Take the link from the official website; check the owner, recent activity and the LICENSE file.","zh":"从官方网站获取链接；检查所有者、近期活跃度和LICENSE文件。"}},{"id":"security-latest","n":2,"phase":"before","text":{"en":"Read SECURITY.md and the Security tab; install the latest release, not the one you read about.","zh":"阅读 SECURITY.md 和Security标签页；安装最新发布版本，而不是你在文章里看到的那个版本。"}},{"id":"ask-claude","n":3,"phase":"before","text":{"en":"Ask Claude to review the repository, read-only, before you install anything.","zh":"安装任何东西之前，请Claude以只读方式审查代码仓库。"}},{"id":"prefer-hosted","n":4,"phase":"before","text":{"en":"Prefer the hosted app or the official release to building from source.","zh":"优先使用托管版应用或官方发布版本，而不是从源代码构建。"}},{"id":"separate-vm","n":5,"phase":"before","text":{"en":"If you must build, do it in a separate virtual machine, never on a work laptop.","zh":"如果必须构建，请在单独的虚拟机中进行，切勿在工作电脑上进行。"}},{"id":"no-pipe","n":6,"phase":"setup","text":{"en":"Never run a download straight in bash: save the script, read it, then run your copy.","zh":"切勿把下载内容直接交给bash运行：先保存脚本，阅读后再运行你保存的那一份。"}},{"id":"ports-passwords","n":7,"phase":"setup","text":{"en":"Bind ports to 127.0.0.1, replace every sample password and key, and limit who can sign up.","zh":"把端口绑定到127.0.0.1，更换所有示例密码和密钥，并限制可以注册的人员。"}},{"id":"one-key","n":8,"phase":"connect","text":{"en":"One API key per tool, each with an expiry date, a hard spending limit and the least access.","zh":"一个工具一把API密钥，每把都设到期日、硬性消费上限和最小权限。"}},{"id":"agent-approvals","n":9,"phase":"connect","text":{"en":"Keep AI agent approvals on (Manual, Ask), give it one folder, and leave Actions off on your fork.","zh":"保持AI智能体的审批开启（Manual、Ask），只给它一个文件夹，并在复刻上保持Actions关闭。"}},{"id":"identity","n":10,"phase":"connect","text":{"en":"Hide your email on GitHub, use your phone's hotspot for sensitive work on public Wi-Fi, and redact screenshots and logs.","zh":"在GitHub上隐藏邮箱，在公共场所处理敏感工作时改用手机热点，并在分享前处理截图和日志中的敏感信息。"}}],"exercise":[{"time":{"en":"0–2 min","zh":"0–2分钟"},"text":{"en":"Pick a project from github.com/trending, or one you have wanted to try.","zh":"从 github.com/trending 选一个项目，或选一个你一直想试用的项目。"}},{"time":{"en":"2–4 min","zh":"2–4分钟"},"text":{"en":"Answer questions 1 and 2 from its GitHub page alone, including the LICENSE file and the latest release.","zh":"只看GitHub页面回答第1、2题，包括LICENSE文件和最新发布版本。"}},{"time":{"en":"4–10 min","zh":"4–10分钟"},"text":{"en":"Clone it, don't install it. In Claude Code, switch to Manual mode, then give it the \"Before you install\" prompt.","zh":"克隆项目，但不要安装。在Claude Code中切换到手动（Manual）模式，然后发送“安装之前”提示词。"}},{"time":{"en":"10–13 min","zh":"10–13分钟"},"text":{"en":"Rate it on the seven questions in the scorer above: OK, Low, Medium or High.","zh":"在上方的评分工具中按七个问题评级：正常、低、中或高。"}},{"time":{"en":"13–15 min","zh":"13–15分钟"},"text":{"en":"Share one finding: what it is, why it is a warning, and how to prevent it.","zh":"分享一项发现：它是什么、为什么是警示、如何防范。"}}],"glossary":[{"term":{"en":"Supply-chain attack","zh":"供应链攻击"},"def":{"en":"Attackers hijack a trusted library or tool, and the harm reaches everyone who installs it.","zh":"攻击者劫持一个可信的库或工具，危害随之波及所有安装它的人。"}},{"term":{"en":"Phishing","zh":"网络钓鱼"},"def":{"en":"A fake email or web page that tricks you into giving away a password or code, as in the chalk and debug case.","zh":"用假冒的邮件或网页骗取密码或验证码，chalk和debug事件就是这样发生的。"}},{"term":{"en":"Install script (postinstall)","zh":"安装脚本（postinstall）"},"def":{"en":"Code that a package runs by itself when you install it.","zh":"软件包在安装时自动运行的代码。"}},{"term":{"en":"Lockfile","zh":"锁定文件（lockfile）"},"def":{"en":"A list of exact versions, so every install gets the same files.","zh":"记录确切版本号的清单，确保每次安装得到相同的文件。"}},{"term":{"en":"IP address and VPN","zh":"IP地址与虚拟专用网络（VPN）"},"def":{"en":"Your internet return address, and a service that shows its own address instead. The VPN company then sees your traffic.","zh":"IP地址相当于你在互联网上的回信地址；VPN则是用自己的地址替你出面的服务，但VPN公司能看到你的流量。"}},{"term":{"en":"Port; 0.0.0.0 vs 127.0.0.1","zh":"端口；0.0.0.0与127.0.0.1"},"def":{"en":"A port is a numbered door into a computer. 0.0.0.0 means open on every network; 127.0.0.1 means this computer only.","zh":"端口是进入电脑的带编号的门。0.0.0.0表示对所有网络开放；127.0.0.1表示仅本机可访问。"}},{"term":{"en":"XSS to RCE","zh":"从XSS到RCE"},"def":{"en":"A web-page scripting bug (cross-site scripting) that turns into running commands on your computer (remote code execution).","zh":"网页脚本漏洞（跨站脚本，XSS）被进一步利用，变成在你电脑上运行命令（远程代码执行，RCE）。"}},{"term":{"en":"Least privilege","zh":"最小权限原则"},"def":{"en":"Give each key, app and AI agent only the access it needs, for only as long as it needs it.","zh":"每把密钥、每个应用和每个AI智能体只获得所需的权限，且只在需要的期间内有效。"}},{"term":{"en":"MCP server","zh":"MCP服务器"},"def":{"en":"A plugin that gives an AI agent new tools. A local one is a program running on your computer with your permissions.","zh":"为AI智能体提供新工具的插件。本地MCP服务器是以你的权限在你电脑上运行的程序。"}},{"term":{"en":"Secret scanning","zh":"密钥扫描"},"def":{"en":"GitHub's automatic search for keys and tokens in code, which can alert you and the key's provider.","zh":"GitHub自动在代码中搜索密钥和令牌，并可通知你和密钥的服务商。"}}],"sources":[{"group":{"en":"LobeHub project (commit f6f0de5, 11 Nov 2026)","zh":"LobeHub项目（提交 f6f0de5，2026 年 11 月 11 日）"},"items":[{"title":{"en":"Commit f6f0de5 on lobehub/lobehub (the version we checked)","zh":"lobehub/lobehub 上的提交 f6f0de5（我们检查的版本）"},"url":"https://github.com/lobehub/lobehub/commit/f6f0de5d7dee51c495602b731e90e2ece47354bf","publisher":"GitHub","date":"2026-11-11","accessed":"2026-11-14"},{"title":{"en":"lobehub/lobehub releases (v2.3.3 marked Latest, 12 Nov 2026)","zh":"lobehub/lobehub 版本发布页（v2.3.3 标为最新，2026 年 11 月 12 日）"},"url":"https://github.com/lobehub/lobehub/releases","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"package.json at the checked commit","zh":"已检查提交中的 package.json"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/package.json","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"LICENSE (LobeHub Community License) at the checked commit","zh":"已检查提交中的LICENSE文件（LobeHub Community License）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/LICENSE","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"SECURITY.md at the checked commit","zh":"已检查提交中的 SE     scorerRefs = { box: box, vlabel: vlabel, vtext: vtext, vcounts: vcounts, badge: badge };

    var loadBtn = h("button", { type: "button", class: "btn", id: "scorer-load-example", text: t("scorer_load_example") });
    loadBtn.addEventListener("click", function () { S.scorer = exampleState(); saveScorer(); rerenderScorer(); });
    var resetBtn = h("button", { type: "button", class: "btn", id: "scorer-reset", text: t("scorer_reset") });
    resetBtn.addEventListener("click", function () { S.scorer = { project: "", notes: "", ratings: emptyRatings() }; saveScorer(); rerenderScorer(); });

    var wrap = h("div", { class: "scorer", id: "scorer-tool" }, [
      h("div", { class: "sc-form" }, [
        badge,
        h("div", { class: "field" }, [h("label", { for: "scorer-project", text: t("scorer_project") }), proj]),
        rows
      ]),
      h("div", { class: "sc-panel" }, box),
      h("div", { class: "sc-notes" }, [
        h("div", { class: "field" }, [h("label", { for: "scorer-notes", text: t("scorer_notes") }), notesArea]),
        h("div", { class: "sc-actions" }, [loadBtn, resetBtn]),
        h("p", { class: "saved-note", text: t("scorer_saved_note") })
      ])
    ]);
    return wrap;
  }
  function rerenderScorer() {
    var old = document.getElementById("scorer-tool");
    if (!old) return;
    var fresh = renderScorer();
    old.parentNode.replaceChild(fresh, old);
    updateVerdict();
  }

  /* ---------- checklist ---------- */
  function loadChecks() {
    var raw = store.get("checklist"), o = {};
    if (raw) { try { var p = JSON.parse(raw); if (p && typeof p === "object") Object.keys(p).forEach(function (k) { if (p[k] === true) o[k] = true; }); } catch (e) { /* ignore */ } }
    return o;
  }
  var ckRefs = {};
  function updateProgress() {
    var total = C.checklist.length, done = C.checklist.filter(function (c) { return S.checks[c.id]; }).length;
    if (!ckRefs.count) return;
    ckRefs.count.textContent = t("checklist_progress", { done: done, total: total });
    ckRefs.bar.style.width = (total ? Math.round(done / total * 100) : 0) + "%";
  }
  function renderChecklist() {
    var phases = ["before", "setup", "connect"];
    var count = h("span", { class: "ck-count", id: "checklist-progress", role: "status", "aria-live": "polite" });
    var bar = h("span");
    ckRefs = { count: count, bar: bar };
    var clear = h("button", { type: "button", class: "btn", id: "checklist-clear", text: t("checklist_clear") });
    clear.addEventListener("click", function () {
      S.checks = {}; store.set("checklist", "{}");
      Array.prototype.forEach.call(document.querySelectorAll(".ck-item input"), function (i) { i.checked = false; });
      updateProgress();
    });
    var groups = phases.map(function (ph) {
      var items = C.checklist.filter(function (c) { return c.phase === ph; });
      if (!items.length) return null;
      return h("div", { class: "phase" }, [
        h("h3", { text: t("phase_" + ph) }),
        h("ul", null, items.map(function (c) {
          var id = "check-" + c.id;
          var box = h("input", { type: "checkbox", id: id, checked: !!S.checks[c.id] });
          box.addEventListener("change", function () {
            if (box.checked) S.checks[c.id] = true; else delete S.checks[c.id];
            store.set("checklist", JSON.stringify(S.checks)); updateProgress();
          });
          return h("li", null, h("label", { class: "ck-item", for: id }, [box, h("span", { class: "ck-n", text: pad2(c.n) }), h("span", { class: "ck-text" }, rich(L(c.text)))]));
        }))
      ]);
    });
    var out = h("div", { class: "ck" }, [
      h("div", { class: "ck-progress" }, [
        h("div", { class: "ck-progress-row" }, [count, clear]),
        h("div", { class: "track", "aria-hidden": "true" }, bar)
      ]),
      groups,
      h("p", { class: "saved-note", text: t("checklist_saved_note") })
    ]);
    return out;
  }

  function renderExercise() {
    return section("exercise", 10, h("ol", { class: "steps" }, C.exercise.map(function (s) {
      return h("li", null, [h("span", { class: "time", text: L(s.time) }), h("span", null, rich(L(s.text)))]);
    })));
  }
  function renderGlossary() {
    var other = S.lang === "zh" ? "en" : "zh";
    return section("glossary", 11, h("dl", { class: "gloss" }, C.glossary.map(function (g) {
      var alt = g.term[other];
      return h("div", null, [
        h("dt", null, [h("span", { text: L(g.term) }), alt && alt !== L(g.term) ? h("span", { class: "alt", lang: other === "zh" ? "zh-Hans" : "en", text: alt }) : null]),
        h("dd", null, rich(L(g.def)))
      ]);
    })));
  }
  function renderSources() {
    return section("sources", 12, h("div", { class: "src-groups" }, C.sources.map(function (g) {
      return h("div", { class: "src-group" }, [h("h3", { text: L(g.group) }), h("ul", { class: "src-list" }, g.items.map(srcItem))]);
    })));
  }

  function renderFooter() {
    var f = document.getElementById("foot");
    f.textContent = "";
    add(f, h("div", { class: "foot-in" }, [
      h("p", { class: "strong", text: t("footer_text") }),
      h("p", { text: L(C.meta.disclaimer) }),
      h("p", { text: t("footer_checked") }),
      h("div", { class: "foot-links" }, [
        ext(C.meta.deck_url, t("footer_deck")),
        h("a", { href: "#hero", text: t("back_to_top") })
      ])
    ]));
  }

  function renderHeader() {
    document.getElementById("brand-name").textContent = L(C.meta.title);
    document.getElementById("brand-tag").textContent = "LobeHub v" + C.meta.version_checked;
    document.getElementById("skip").textContent = t("skip_to_content");
    document.getElementById("lang").setAttribute("aria-label", t("lang_switch"));
    document.getElementById("nav").setAttribute("aria-label", t("nav_label"));
    document.getElementById("lang-en").setAttribute("aria-pressed", S.lang === "en" ? "true" : "false");
    document.getElementById("lang-zh").setAttribute("aria-pressed", S.lang === "zh" ? "true" : "false");
    var ul = document.getElementById("nav-list");
    ul.textContent = "";
    SECTION_IDS.forEach(function (id) { ul.appendChild(h("li", null, h("a", { href: "#" + id, "data-sec": id, text: t("nav_" + id) }))); });
  }

  /* ---------- whole page ---------- */
  function barHeight() { var b = document.getElementById("bar"); return b ? b.getBoundingClientRect().height : 0; }
  function captureAnchor() {
    if ((window.scrollY || 0) < 4) return null;
    var top = barHeight();
    var els = document.querySelectorAll("#main [data-anchor]");
    var best = null;
    for (var i = 0; i < els.length; i++) {
      var r = els[i].getBoundingClientRect();
      if (r.bottom > top + 1 && r.top <= top + 1) best = { id: els[i].id, offset: r.top };
      else if (r.top > top + 1) { if (!best) best = { id: els[i].id, offset: r.top }; break; }
    }
    if (best) {
      /* if the anchor started above the bar, keep the reader's relative position inside it */
      var el = document.getElementById(best.id), rr = el.getBoundingClientRect();
      best.frac = rr.height ? (top - rr.top) / rr.height : 0;
    }
    return best;
  }
  function restoreAnchor(a) {
    if (!a) return;
    var el = document.getElementById(a.id);
    if (!el) return;
    var r = el.getBoundingClientRect(), top = barHeight();
    var target = a.offset >= top - 1 ? r.top - a.offset : r.top - top + a.frac * r.height;
    window.scrollTo({ top: window.scrollY + target, left: 0, behavior: "instant" });
  }

  function render() {
    document.documentElement.lang = S.lang === "zh" ? "zh-Hans" : "en";
    var anchor = captureAnchor();
    renderHeader();
    var main = document.getElementById("main");
    main.textContent = "";
    add(main, [
      renderHero(), renderWhy(), renderIncidents(), renderQuestions(), renderConnect(), renderSentinel(), renderVerdict(),
      section("scorer", 8, renderScorer()),
      section("checklist", 9, renderChecklist()),
      renderExercise(), renderGlossary(), renderSources()
    ]);
    renderFooter();
    updateVerdict(); updateProgress(); setBarVar();
    restoreAnchor(anchor);
    lastCur = null; markCurrent();
  }

  function setLang(l) {
    if (l !== "en" && l !== "zh") return;
    if (l === S.lang) return;
    S.lang = l; store.set("lang", l); render();
  }
  document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
  document.getElementById("lang-zh").addEventListener("click", function () { setLang("zh"); });

  /* ---------- sticky bar height + current section ---------- */
  function setBarVar() { document.documentElement.style.setProperty("--bar-h", Math.round(barHeight()) + "px"); }
  var ticking = false;
  function reducedMotion() {
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
  }
  /* on narrow screens the section menu scrolls sideways: bring the current item into view inside the menu only */
  function revealNavItem(a) {
    var ul = document.getElementById("nav-list");
    if (!a || !ul || ul.scrollWidth <= ul.clientWidth + 1) return;
    var ar = a.getBoundingClientRect(), ur = ul.getBoundingClientRect();
    if (ar.left >= ur.left && ar.right <= ur.right) return;
    var y = window.scrollY;
    try { a.scrollIntoView({ inline: "nearest", block: "nearest", behavior: reducedMotion() ? "auto" : "smooth" }); } catch (e) { /* old browsers */ }
    if (Math.abs(window.scrollY - y) > 1) window.scrollTo({ top: y, left: window.scrollX, behavior: "instant" });
  }
  var lastCur = null;
  function markCurrent() {
    ticking = false;
    var top = barHeight() + 24, cur = SECTION_IDS[0], curLink = null;
    SECTION_IDS.forEach(function (id) { var el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= top) cur = id; });
    var links = document.querySelectorAll("#nav-list a");
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute("data-sec") === cur) { links[i].setAttribute("aria-current", "true"); curLink = links[i]; }
      else links[i].removeAttribute("aria-current");
    }
    if (cur !== lastCur) { lastCur = cur; revealNavItem(curLink); }
  }
  window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(markCurrent); } }, { passive: true });
  window.addEventListener("resize", function () { setBarVar(); markCurrent(); });

  render();
})();
</script>
