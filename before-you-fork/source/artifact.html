<title>Before You Fork</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a field guide / pre-flight checklist. A navy instrument bar on toned paper; each section has a left margin
   rail (running order + eyebrow in mono) and a ~70ch content column; cards only for question cards, prompts and the
   scorer. Amber is the one warning accent; severity colours always carry their word and a 4-step meter. */
:root {
  --paper: #eceee8;
  --surface: #f7f8f4;
  --sunk: #e1e4dc;
  --ink: #152238;
  --ink-2: #44506a;
  --ink-3: #566073;
  --rule: #c5cac0;
  --rule-strong: #152238;
  --bar: #152238;
  --bar-ink: #e9edf4;
  --bar-ink-2: #a3b2c9;
  --bar-line: #2c3d5a;
  --amber: #995800;
  --amber-bg: #faeacc;
  --amber-line: #d9961e;
  --link: #1c4a8a;
  --ok: #1b6743;
  --ok-bg: #d7ebdd;
  --low: #21578a;
  --low-bg: #d9e6f2;
  --med: #8a4f00;
  --med-bg: #f6e2bd;
  --high: #a01c1c;
  --high-bg: #f4d7d3;
  --nc: #565f72;
  --nc-bg: #dfe2e7;
  --code-bg: #e0e4dc;
  --focus: #d48a0c;
  --font-text: "IBM Plex Sans", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-zh: "Noto Sans SC", "IBM Plex Sans", system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans SC", monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --bar-h: 92px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1522; --surface: #151f30; --sunk: #0a1019; --ink: #e3e8f0; --ink-2: #aab4c6; --ink-3: #8a95a8;
    --rule: #2a3649; --rule-strong: #c9d2e0; --bar: #081019; --bar-ink: #e3e8f0; --bar-ink-2: #8e9db5; --bar-line: #1f2b3e;
    --amber: #f2b552; --amber-bg: #33240e; --amber-line: #b8811f; --link: #93bdf2;
    --ok: #79d4a3; --ok-bg: #0f2c1f; --low: #92bdee; --low-bg: #132941; --med: #f2b552; --med-bg: #33240e;
    --high: #f5958d; --high-bg: #3a1614; --nc: #aab4c6; --nc-bg: #1e2839; --code-bg: #1b2537; --focus: #f2b552;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1522; --surface: #151f30; --sunk: #0a1019; --ink: #e3e8f0; --ink-2: #aab4c6; --ink-3: #8a95a8;
  --rule: #2a3649; --rule-strong: #c9d2e0; --bar: #081019; --bar-ink: #e3e8f0; --bar-ink-2: #8e9db5; --bar-line: #1f2b3e;
  --amber: #f2b552; --amber-bg: #33240e; --amber-line: #b8811f; --link: #93bdf2;
  --ok: #79d4a3; --ok-bg: #0f2c1f; --low: #92bdee; --low-bg: #132941; --med: #f2b552; --med-bg: #33240e;
  --high: #f5958d; --high-bg: #3a1614; --nc: #aab4c6; --nc-bg: #1e2839; --code-bg: #1b2537; --focus: #f2b552;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 16px;
  line-height: 1.6;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  padding-block: 0 0;
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
  text-rendering: optimizeLegibility;
}
html[lang="zh-Hans"] body { font-family: var(--font-zh); line-height: 1.75; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar);
}
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
code {
  font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); color: var(--ink);
  padding: 0.08em 0.36em; border-radius: 3px; overflow-wrap: anywhere;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--amber-bg); color: var(--ink);
  padding: 8px 12px; border: 2px solid var(--amber-line); font-weight: 600;
}
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 8px); }
.mono { font-family: var(--font-mono); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r));
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--bar); color: var(--bar-ink); border-bottom: 1px solid var(--bar-line);
}
.bar-in { max-width: 1160px; margin-inline: auto; display: grid; gap: 2px; padding-block: 8px 0; }
.bar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.brand {
  display: inline-flex; align-items: baseline; gap: 10px; min-width: 0; color: var(--bar-ink); text-decoration: none;
  font-weight: 600; font-size: 16px; letter-spacing: 0.01em;
}
.brand-tag {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--bar-ink-2); letter-spacing: 0.06em;
  white-space: nowrap;
}
@media (max-width: 520px) { .brand-tag { display: none; } }
.brand-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang { display: inline-flex; flex: none; border: 1px solid var(--bar-line); border-radius: 4px; overflow: hidden; }
.lang button {
  font: 500 13px/1 var(--font-text); color: var(--bar-ink-2); background: transparent; border: 0; padding: 8px 12px;
  cursor: pointer; min-height: 32px;
}
.lang button + button { border-left: 1px solid var(--bar-line); }
.lang button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); }
.lang button:focus-visible { outline-offset: -3px; }
.nav { min-width: 0; }
.nav ul {
  list-style: none; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; padding-block: 4px 6px;
  -webkit-overflow-scrolling: touch;
}
.nav a {
  display: block; white-space: nowrap; color: var(--bar-ink-2); text-decoration: none; font-size: 13px;
  padding: 5px 9px; border-radius: 3px;
}
.nav a:hover { color: var(--bar-ink); background: var(--bar-line); }
.nav a[aria-current="true"] { color: var(--bar-ink); box-shadow: inset 0 -2px 0 var(--amber-line); }
.nav a:focus-visible { outline-offset: -2px; }

/* ---------- page frame ---------- */
/* single-column grids: the one track may shrink below its content, so long words wrap or scroll inside */
.body, .hero-main, .qlist, .qcard, .qcheck, .lh, .subs, .sub, .prompts, .prompt, .sc-form, .sc-notes, .ck, .phase, .src-group,
.incident, .placard, .ev, .vbox, .caution, .field, .rate { grid-template-columns: minmax(0, 1fr); }
main { max-width: 1160px; margin-inline: auto; display: grid; }
main:focus { outline: none; }
.sec {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px 48px; padding-block: 56px;
  border-top: 1px solid var(--rule); scroll-margin-top: calc(var(--bar-h) + 8px);
}
.rail { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.idx { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }
.eyebrow {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--amber);
}
.body { display: grid; gap: 22px; min-width: 0; align-content: start; }
.body > h2 { font-size: clamp(26px, 3.2vw, 34px); font-weight: 700; letter-spacing: -0.01em; max-width: 30ch; }
html[lang="zh-Hans"] .body > h2 { letter-spacing: 0; max-width: 24em; }
.lead { font-size: 18px; color: var(--ink-2); max-width: 68ch; line-height: 1.55; }
.prose { max-width: 70ch; }
@media (min-width: 1000px) {
  .sec { grid-template-columns: 168px minmax(0, 1fr); }
  .rail { flex-direction: column; gap: 6px; position: sticky; top: calc(var(--bar-h) + 28px); align-self: start; }
}
h3.sub-t { font-size: 21px; font-weight: 650; }
.label {
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--ink-3);
}

/* ---------- hero ---------- */
.hero {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; padding-block: 48px 56px;
  scroll-margin-top: calc(var(--bar-h) + 8px);
}
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 56px; padding-block: 72px 64px; } }
.hero-main { display: grid; gap: 18px; align-content: start; min-width: 0; }
.hero h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; max-width: 18ch; }
html[lang="zh-Hans"] .hero h1 { letter-spacing: 0; line-height: 1.25; max-width: 14em; }
.hero-sub { font-size: 19px; color: var(--ink); max-width: 56ch; }
.promise { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding-top: 6px; }
.promise li {
  font-family: var(--font-mono); font-size: 13px; font-weight: 500; padding: 6px 10px; border: 1px solid var(--rule-strong);
  border-radius: 3px; background: var(--surface);
}
.placard {
  border: 1.5px solid var(--rule-strong); background: var(--surface); padding: 20px; display: grid; gap: 14px;
  align-content: start; align-self: start; min-width: 0; border-radius: 4px;
}
.placard-head { font-family: var(--font-mono); font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.placard dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 14px; }
.placard dt { color: var(--ink-3); font-family: var(--font-mono); font-size: 12px; padding-top: 2px; }
.placard dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.placard p { font-size: 14.5px; color: var(--ink-2); }
.note-amber {
  background: var(--amber-bg); border: 1px solid var(--amber-line); padding: 10px 12px; border-radius: 3px;
  color: var(--ink) !important;
}
.note-amber .label, .caution .label { color: var(--amber); display: block; margin-bottom: 2px; }

/* ---------- pills / meters ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em; padding: 3px 9px 3px 7px; border-radius: 999px; border: 1px solid currentColor;
  white-space: nowrap; line-height: 1.4; vertical-align: middle;
}
.meter { display: inline-flex; gap: 2px; align-items: flex-end; }
.meter i { display: block; width: 3px; background: currentColor; opacity: 0.22; border-radius: 1px; }
.meter i:nth-child(1) { height: 5px; } .meter i:nth-child(2) { height: 7px; }
.meter i:nth-child(3) { height: 9px; } .meter i:nth-child(4) { height: 11px; }
.lvl-1 i:nth-child(-n+1), .lvl-2 i:nth-child(-n+2), .lvl-3 i:nth-child(-n+3), .lvl-4 i:nth-child(-n+4) { opacity: 1; }
.sev-ok { color: var(--ok); background: var(--ok-bg); }
.sev-low { color: var(--low); background: var(--low-bg); }
.sev-medium { color: var(--med); background: var(--med-bg); }
.sev-high { color: var(--high); background: var(--high-bg); }
.sev-not_checked { color: var(--nc); background: var(--nc-bg); }

/* ---------- why: stages ---------- */
.stages { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; list-style: none; }
.stage {
  display: grid; gap: 8px; align-content: start; padding: 14px 16px; border: 1px solid var(--rule); background: var(--surface);
  border-radius: 4px; min-width: 0;
}
.stage-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.stage-n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.stage h3 { font-size: 18px; font-weight: 650; }
.stage p { font-size: 14.5px; color: var(--ink-2); }
.gate {
  display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-mono); font-size: 12px;
  font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber);
  border: 1.5px dashed var(--amber-line); background: var(--amber-bg); border-radius: 4px; padding: 8px 10px; text-align: center;
}
@media (min-width: 820px) {
  .stages { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 92px minmax(0, 1fr) minmax(0, 1fr); }
  .gate { writing-mode: horizontal-tb; flex-direction: column; padding: 10px 6px; }
}
.why-note { border-left: 3px solid var(--amber-line); padding: 4px 0 4px 14px; max-width: 68ch; font-weight: 500; }

/* ---------- incidents ---------- */
.incidents { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 760px) { .incidents { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.incident {
  border-top: 2px solid var(--rule-strong); padding-top: 14px; display: grid; gap: 10px; align-content: start; min-width: 0;
}
.inc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.inc-name { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.inc-date { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.incident h3 { font-size: 19px; font-weight: 650; }
.incident p { font-size: 15px; }
.lesson { background: var(--sunk); padding: 10px 12px; border-radius: 3px; }
.lesson .label { display: block; margin-bottom: 2px; }
.mini-links { list-style: none; display: grid; gap: 4px; font-size: 13px; }
.mini-links li { overflow-wrap: anywhere; }
.pub { color: var(--ink-3); }

/* ---------- question cards ---------- */
.qlist { display: grid; gap: 20px; }
.qcard {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; display: grid; gap: 18px;
  min-width: 0; scroll-margin-top: calc(var(--bar-h) + 12px);
}
.qhead { display: grid; gap: 6px; }
.qhead h3 { font-size: 22px; font-weight: 700; }
.qnum { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }
.qgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
@media (min-width: 860px) { .qgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 28px; } }
.qcheck { margin: 0; display: grid; gap: 12px; align-content: start; }
.qcheck dt { margin-bottom: -10px; }
.qcheck dd { margin: 0; font-size: 15px; }
.lh {
  border: 1px dashed var(--ink-3); border-radius: 4px; padding: 14px 16px; display: grid; gap: 12px; align-content: start;
  min-width: 0; background: var(--paper);
}
.lh-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.lh-label { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
.lh > p { font-size: 15px; }
html[lang="zh-Hans"] .lh-label { text-transform: none; letter-spacing: 0.02em; }
.lh .reason { color: var(--ink-2); }
.evidence { list-style: none; display: grid; gap: 6px; font-size: 13.5px; }
.evidence li { display: grid; gap: 1px; min-width: 0; }
.evidence code { font-size: 12.5px; }
.evidence .ev-note { color: var(--ink-2); overflow-wrap: anywhere; }
pre.code {
  margin: 0; background: var(--code-bg); border-radius: 4px; padding: 10px 12px; overflow-x: auto; font-size: 13px;
  font-family: var(--font-mono); line-height: 1.5; max-width: 100%;
}
pre.code code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; white-space: pre; }
.takeaway {
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 12px;
  font-weight: 600;
}
.takeaway .label { color: var(--amber); }
.takeaway span:last-child { min-width: 0; flex: 1 1 24ch; }

details > summary {
  cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--link); list-style: none; display: inline-flex;
  align-items: center; gap: 8px; padding-block: 2px;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before {
  content: ""; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent;
  border-bottom: 4px solid transparent; flex: none;
}
@media (prefers-reduced-motion: no-preference) { details > summary::before { transition: transform 0.15s; } }
details[open] > summary::before { transform: rotate(90deg); }
.count { color: var(--ink-3); font-family: var(--font-mono); font-size: 12px; }
.srcs ul { margin-top: 8px; }
.src-list { list-style: none; display: grid; gap: 8px; font-size: 14px; }
.src-list li { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.src-meta { font-size: 12.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.badge-unc {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--amber); border: 1px solid var(--amber-line);
  background: var(--amber-bg); padding: 1px 6px; border-radius: 3px;
}

/* tables */
.table-wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--rule); }
tr:last-child > td { border-bottom: 0; }
th {
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-3); background: var(--sunk); white-space: nowrap;
}
.adv-wrap { max-height: 360px; overflow: auto; margin-top: 10px; }
.adv-wrap table { min-width: 720px; font-size: 13px; }
.adv-wrap th { position: sticky; top: 0; z-index: 1; }
.adv-wrap td:nth-child(-n+5) { white-space: nowrap; font-family: var(--font-mono); font-size: 12px; }
.c-n { width: 3em; font-family: var(--font-mono); color: var(--ink-3); }
.c-where { font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.rtable td { min-width: 0; }
.rtable td .code { margin-top: 8px; }
@media (max-width: 680px) {
  .rwrap { border: 0; background: transparent; overflow: visible; }
  .rtable, .rtable tbody, .rtable tr, .rtable td { display: block; width: 100%; }
  .rtable thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .rtable tr { border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); padding: 6px 0; }
  .rtable tr + tr { margin-top: 10px; }
  .rtable td { border: 0; padding: 6px 12px; }
  .rtable td::before {
    content: attr(data-label); display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px;
  }
  .rtable td.c-first { font-weight: 600; }
  .rtable td.c-first::before { display: none; }
}

/* ---------- connect ---------- */
.subs { display: grid; gap: 44px; }
.sub { display: grid; gap: 16px; min-width: 0; scroll-margin-top: calc(var(--bar-h) + 12px); }
.sub-head { display: flex; gap: 12px; align-items: baseline; }
.sub-head .idx { flex: none; }
.rules { list-style: none; display: grid; border-top: 1px solid var(--rule-strong); }
.rules li {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px 24px; padding-block: 11px; border-bottom: 1px solid var(--rule);
}
@media (min-width: 760px) { .rules li { grid-template-columns: minmax(0, 15em) minmax(0, 1fr); } }
.rules .rule-t { font-weight: 650; }
.rules p:last-child { font-size: 15px; color: var(--ink-2); }

/* ---------- sentinel ---------- */
.prompts { display: grid; gap: 16px; }
.prompt {

urces","zh":"隐藏资料来源"},"example":{"en":"Example","zh":"示例"},"lesson":{"en":"Lesson","zh":"教训"},"unconfirmed":{"en":"Unconfirmed: re-check before relying on it","zh":"未经直接核实，使用前请再次确认"},"accessed":{"en":"Accessed","zh":"查阅日期"},"date":{"en":"Date","zh":"日期"},"opens_new_tab":{"en":"opens in a new tab","zh":"在新标签页打开"},"col_action":{"en":"What to do","zh":"做什么"},"col_where":{"en":"Where","zh":"在哪里"},"col_why":{"en":"Why","zh":"原因"},"col_question":{"en":"Question","zh":"问题"},"col_rating":{"en":"Rating","zh":"评级"},"col_found":{"en":"What we found","zh":"发现"},"scorer_project":{"en":"Project name","zh":"项目名称"},"scorer_project_placeholder":{"en":"e.g. owner/repository","zh":"例如 owner/repository"},"scorer_notes":{"en":"Notes","zh":"备注"},"scorer_notes_placeholder":{"en":"What you found, with file names","zh":"记录你的发现，并注明文件名"},"scorer_rating_for":{"en":"Rating for question {n}","zh":"第{n}题的评级"},"scorer_verdict":{"en":"Overall verdict","zh":"总体结论"},"scorer_counts":{"en":"{high} High · {medium} Medium · {low} Low · {ok} OK · {unchecked} not checked","zh":"高{high}项 · 中{medium}项 · 低{low}项 · 正常{ok}项 · 未检查{unchecked}项"},"scorer_reset":{"en":"Reset","zh":"重置"},"scorer_example_badge":{"en":"Example: pre-filled with our LobeHub ratings. Change any rating, or press Reset to start a new project.","zh":"示例：已预填我们对LobeHub的评级。可修改任一评级，或点击“重置”开始评估新项目。"},"scorer_saved_note":{"en":"Saved in this browser only. Nobody else sees it.","zh":"仅保存在本浏览器中，其他人看不到。"},"checklist_progress":{"en":"{done} of {total} done","zh":"已完成{done}/{total}项"},"checklist_clear":{"en":"Clear ticks","zh":"清除勾选"},"checklist_saved_note":{"en":"Ticks are saved in this browser only.","zh":"勾选状态仅保存在本浏览器中。"},"phase_before":{"en":"Before you install","zh":"安装之前"},"phase_setup":{"en":"While you set it up","zh":"安装配置时"},"phase_connect":{"en":"When you connect","zh":"连接账号和服务时"},"prompt_en_note":{"en":"Copies the English version","zh":"复制英文版本"},"prompt_zh_note":{"en":"Copies the Chinese version","zh":"复制中文版本"},"footer_text":{"en":"Educational guide for a team cybersecurity workshop, prepared with Claude Code. Not professional security advice.","zh":"本页为团队网络安全研讨会准备的学习资料，使用Claude Code整理，不构成专业安全建议。"},"footer_checked":{"en":"LobeHub checked 11 Nov 2026 (v2.3.2). Web sources read 14 Nov 2026.","zh":"LobeHub检查日期：2026 年 11 月 11 日（v2.3.2）。网络资料查阅日期：2026 年 11 月 14 日。"},"footer_deck":{"en":"Workshop slides","zh":"研讨会幻灯片"}},"sections":{"hero":{"eyebrow":{"en":"Cybersecurity workshop · team meeting","zh":"网络安全研讨会 · 团队会议"},"title":{"en":"Before you fork: a security check for any project you download","zh":"复刻（fork）之前：下载任何项目前的安全检查"},"intro":{"en":"Seven questions to ask before you clone, install or run code from the internet. Claude can do most of the reading. Worked example: LobeHub, the AI agent workspace we are testing.","zh":"从网上克隆、安装或运行代码之前，先问七个问题。大部分阅读工作可以交给Claude。示例项目是我们正在试用的AI智能体工作平台LobeHub。"}},"why":{"eyebrow":{"en":"Where the risk is","zh":"风险在哪里"},"title":{"en":"Reading code is safe. Running it is where the risk starts.","zh":"阅读代码是安全的，运行代码才开始有风险。"},"intro":{"en":"A clone or download only copies text files. Installing runs code, and in a modern project much of that code comes from hundreds of other projects. Connecting then adds your API keys, files and accounts.","zh":"克隆或下载只是复制文本文件。安装则会运行代码，而现代项目的大部分代码来自数百个其他项目。到了连接这一步，你的API密钥、文件和账号也会随之接入。"},"note":{"en":"Do the check between step 2 and step 3: after you can read the files, before anything runs.","zh":"在第2步和第3步之间做检查：文件已经可以阅读，但还没有运行任何东西。"}},"incidents":{"eyebrow":{"en":"Real cases","zh":"真实案例"},"title":{"en":"This happens to big, trusted projects","zh":"大型知名项目也会遭到攻击"},"intro":{"en":"In each case below, victims did nothing unusual. Installing was enough. A famous project with many stars is not a security check.","zh":"在以下案例中，受害者都没有做任何异常操作，只是正常安装就受到了影响。项目有名、星标多，并不等于通过了安全检查。"}},"questions":{"eyebrow":{"en":"The check","zh":"检查方法"},"title":{"en":"Seven questions before you install anything","zh":"安装任何东西之前的七个问题"},"intro":{"en":"Questions 1 and 2 take two minutes on the GitHub page. Questions 3 to 7 need someone to read the files, which is where Claude helps. Each card shows what we found in LobeHub v2.3.2, with the file and line.","zh":"第1、2题在GitHub页面上两分钟就能回答。第3至7题需要阅读文件，这正是Claude可以帮忙的地方。每张卡片都列出我们在LobeHub v2.3.2中的发现，并注明文件和行号。"}},"connect":{"eyebrow":{"en":"Connecting safely","zh":"安全连接"},"title":{"en":"Every connection is a key. Give each one the least access.","zh":"每一个连接都是一把钥匙，只给最小权限。"},"intro":{"en":"Tools like LobeHub work by connecting to other services: AI models, Google Drive, GitHub. Each connection is an API key or a permission, and whoever holds it can spend or read on your account.","zh":"LobeHub这类工具需要连接其他服务才能工作，例如AI模型、Google Drive和GitHub。每个连接都是一个API密钥或一项授权，谁拿到它，谁就能用你的账号花钱或读取数据。"}},"sentinel":{"eyebrow":{"en":"Claude as sentinel","zh":"让Claude把关"},"title":{"en":"Ask Claude before you install, share or connect","zh":"安装、分享或连接之前，先问Claude"},"intro":{"en":"Three moments to stop and ask: before installing a project, before sharing a screenshot, log or file, and before connecting an app. Describe the thing; never paste the secret. The copy button copies the prompt in the language you are reading.","zh":"在三个时刻停下来问一问：安装项目之前，分享截图、日志或文件之前，以及连接应用之前。描述情况即可，切勿粘贴密钥本身。复制按钮会复制当前阅读语言的提示词。"}},"verdict":{"eyebrow":{"en":"The worked example","zh":"示例结论"},"title":{"en":"LobeHub: safe to clone, careful to install","zh":"LobeHub：可以克隆，安装须谨慎"},"intro":{"en":"Our ratings for LobeHub v2.3.2 on the seven questions, using the severities from our file review.","zh":"以下是我们根据文件审查结果，对LobeHub v2.3.2七个问题的评级。"}},"scorer":{"eyebrow":{"en":"Your turn","zh":"轮到你了"},"title":{"en":"Score a project","zh":"给项目评分"},"intro":{"en":"Pick a rating for each question and the page works out an overall verdict. It opens with our LobeHub ratings as an example. Your ratings and notes stay in this browser only.","zh":"为每个问题选择评级，页面会自动给出总体结论。打开时预填了我们对LobeHub的评级作为示例。你的评级和备注只保存在本浏览器中。"}},"checklist":{"eyebrow":{"en":"Take this home","zh":"带回去用"},"title":{"en":"Safe install checklist","zh":"安全安装检查清单"},"intro":{"en":"Steps 1 to 5 happen before anything is installed, 6 and 7 while you set it up, and 8 to 10 whenever you connect keys, accounts or networks. If you remember one line, make it step 3.","zh":"第1至5步在安装任何东西之前完成，第6、7步在安装设置时完成，第8至10步在连接密钥、账号或网络时完成。如果只记住一条，请记住第3步。"}},"exercise":{"eyebrow":{"en":"Hands-on · 15 minutes","zh":"动手练习 · 15分钟"},"title":{"en":"Your turn: check one project","zh":"轮到你了：检查一个项目"},"intro":{"en":"Work in pairs: one person drives, one reads Claude's answers aloud. When Claude flags something, ask it why it is a warning and how an attacker would use it.","zh":"两人一组：一人操作，一人朗读Claude的回答。Claude指出问题时，追问它为什么这是警示，以及攻击者会如何利用。"}},"glossary":{"eyebrow":{"en":"Homework","zh":"课后作业"},"title":{"en":"Ten terms to look up this week","zh":"本周要查一查的十个术语"},"intro":{"en":"These cover everything on this page. Look each one up and read one real case.","zh":"这些术语涵盖了本页的全部内容。逐个查一查，并读一个真实案例。"}},"sources":{"eyebrow":{"en":"Sources","zh":"资料来源"},"title":{"en":"Where every fact comes from","zh":"每条信息的出处"},"intro":{"en":"LobeHub files were read at commit f6f0de5 on 11 Nov 2026; web pages were read on 14 Nov 2026. Items marked unconfirmed could not be opened directly and should be re-checked.","zh":"LobeHub文件于 2026 年 11 月 11 日在提交 f6f0de5 上阅读；网页于 2026 年 11 月 14 日查阅。标为“未经直接核实”的条目无法直接打开，使用前请再次确认。"}}},"stages":[{"n":1,"name":{"en":"Browse","zh":"浏览"},"risk":"safe","text":{"en":"Reading the project page and its code on GitHub.","zh":"在GitHub上阅读项目页面和代码。"}},{"n":2,"name":{"en":"Download","zh":"下载"},"risk":"low","text":{"en":"Clone, fork or ZIP. Files are copied; nothing runs yet.","zh":"克隆、复刻或下载ZIP。只是复制文件，还没有运行任何东西。"}},{"n":3,"name":{"en":"Install & run","zh":"安装并运行"},"risk":"high","text":{"en":"Code from many other projects runs with your permissions.","zh":"来自许多其他项目的代码以你的权限运行。"}},{"n":4,"name":{"en":"Connect","zh":"连接"},"risk":"high","text":{"en":"Your API keys, files, accounts and network join in.","zh":"你的API密钥、文件、账号和网络都会随之接入。"}}],"incidents":[{"id":"xz-utils","name":{"en":"xz-utils","zh":"xz-utils"},"date":"2024-03-29","date_label":{"en":"29 Mar 2024","zh":"2024 年 3 月 29 日"},"title":{"en":"A patient insider","zh":"潜伏的内部人"},"text":{"en":"Someone who had gained the maintainers' trust hid a backdoor in the release downloads of XZ Utils 5.6.0 and 5.6.1, a Linux compression library (CVE-2024-3094). On some systems it hooked into the SSH remote-login server and could allow unauthorised access. Developer Andres Freund noticed SSH logins using more CPU and running slower: a failed login took about 0.8 seconds instead of 0.3. He reported it on 29 March 2024, and CISA advised moving back to a safe version such as 5.4.6.","zh":"一名已取得维护者信任的贡献者，在Linux压缩库XZ Utils 5.6.0和5.6.1的发布下载包中藏入了后门（CVE-2024-3094）。在部分系统上，它会嵌入SSH远程登录服务，可能导致未经授权的访问。开发者Andres Freund发现SSH登录占用更多CPU、速度变慢：一次失败的登录约需0.8秒，而正常只需0.3秒。他于 2024 年 3 月 29 日公开报告，美国网络安全与基础设施安全局（CISA）随后建议退回5.4.6等安全版本。"},"lesson":{"en":"A trusted project can be attacked from the inside, and the download can differ from the code you see. Pin versions, prefer packages your operating system vendor has vetted, and treat odd behaviour as a warning.","zh":"可信的项目也可能被内部人攻破，下载包也可能与你看到的源代码不同。请固定版本，优先使用操作系统发行版审核过的软件包，并把异常现象当作警示。"},"sources":[{"title":{"en":"Reported Supply Chain Compromise Affecting XZ Utils Data Compression Library, CVE-2024-3094","zh":"CISA：XZ Utils数据压缩库遭供应链攻击通报（CVE-2024-3094）"},"url":"https://www.cisa.gov/news-events/alerts/2024/03/29/reported-supply-chain-compromise-affecting-xz-utils-data-compression-library-cve-2024-3094","publisher":"CISA","date":"2024-03-29","accessed":"2026-11-14"},{"title":{"en":"backdoor in upstream xz/liblzma leading to ssh server compromise","zh":"上游 xz/liblzma 后门导致SSH服务器被入侵（原始报告）"},"url":"https://www.openwall.com/lists/oss-security/2024/03/29/4","publisher":"oss-security mailing list (Andres Freund)","date":"2024-03-29","accessed":"2026-11-14"}]},{"id":"chalk-debug","name":{"en":"chalk, debug","zh":"chalk、debug"},"date":"2025-09-08","date_label":{"en":"8 Sep 2025","zh":"2025 年 9 月 8 日"},"title":{"en":"One fake support email","zh":"一封假冒的客服邮件"},"text":{"en":"A maintainer of popular JavaScript packages was phished by an email from support@npmjs.help, a look-alike domain registered on 5 September 2025. Attackers then published malicious versions of 18 packages, including chalk and debug, which together have more than 2 billion downloads a week (Aikido's count; other researchers list more packages). The code ran in website visitors' browsers and swapped crypto wallet addresses so that payments went to the attackers. Semgrep reports that many of the bad versions were removed in under an hour.","zh":"一位热门JavaScript软件包的维护者遭到网络钓鱼：钓鱼邮件来自 support@npmjs.help，这是一个于 2025 年 9 月 5 日注册的仿冒域名。攻击者随后发布了18个软件包的恶意版本，其中包括chalk和debug，这些软件包合计每周下载量超过20亿次（Aikido的统计；其他研究机构列出的软件包更多）。恶意代码在网站访客的浏览器中运行，替换加密货币钱包地址，使付款流向攻击者。据Semgrep报告，许多恶意版本在一小时内被删除。"},"lesson":{"en":"One phished maintainer account can reach billions of installs within minutes. Use lockfiles, wait before taking brand-new versions, and protect developer accounts with phishing-resistant multi-factor sign-in.","zh":"一个维护者账号被钓鱼攻破，几分钟内就可能波及数十亿次安装。请使用锁定文件（lockfile），不要立即采用刚发布的新版本，并为开发者账号启用防钓鱼的多重身份验证。"},"sources":[{"title":{"en":"npm debug and chalk packages compromised","zh":"npm软件包debug和chalk遭入侵"},"url":"https://www.aikido.dev/blog/npm-debug-and-chalk-packages-compromised","publisher":"Aikido Security","date":"2025-09-08","accessed":"2026-11-14"},{"title":{"en":"Security Alert: chalk, debug and color on npm compromised in new supply chain attack","zh":"安全警报：npm上的chalk、debug和color在新一轮供应链攻击中遭入侵"},"url":"https://semgrep.dev/blog/2025/chalk-debug-and-color-on-npm-compromised-in-new-supply-chain-attack/","publisher":"Semgrep","date":"2025-09-08","accessed":"2026-11-14"}]},{"id":"shai-hulud","name":{"en":"Shai-Hulud","zh":"Shai-Hulud"},"date":"2025-09-15","date_label":{"en":"From 15 Sep 2025","zh":"2025 年 9 月 15 日起"},"title":{"en":"A worm that spreads itself","zh":"会自我传播的蠕虫"},"text":{"en":"Infected npm packages ran a script during install that searched the computer for secrets: npm tokens, GitHub access tokens and cloud keys for AWS, Google Cloud and Azure. It sent them to the attacker and posted them in a public GitHub repository named Shai-Hulud, then used the stolen npm tokens to publish infected copies of the victim's other packages. CISA reported more than 500 packages compromised in its alert of 23 September 2025. Wiz also saw private repositories forced public.","zh":"被感染的npm软件包在安装时运行脚本，搜索电脑上的密钥，包括npm令牌、GitHub访问令牌，以及AWS、Google Cloud和Azure的云服务密钥。它把这些密钥发送给攻击者，并公开发布到一个名为Shai-Hulud的GitHub代码仓库，再用窃取的npm令牌把受害者维护的其他软件包也植入恶意代码后重新发布。CISA在 2025 年 9 月 23 日的通报中称，超过500个软件包受到影响。Wiz还发现有私有代码仓库被强行公开。"},"lesson":{"en":"Install scripts run with your credentials. One install on a laptop or build server can leak every token on it. Block unreviewed install scripts, rotate secrets and keep tokens short-lived.","zh":"安装脚本以你的身份运行。在笔记本电脑或构建服务器上安装一次，就可能泄露机器上的全部令牌。请阻止未经审查的安装脚本，定期轮换密钥，并缩短令牌有效期。"},"sources":[{"title":{"en":"Widespread Supply Chain Compromise Impacting npm Ecosystem","zh":"CISA：npm生态系统大范围供应链攻击通报"},"url":"https://www.cisa.gov/news-events/alerts/2025/09/23/widespread-supply-chain-compromise-impacting-npm-ecosystem","publisher":"CISA","date":"2025-09-23","accessed":"2026-11-14"},{"title":{"en":"Shai-Hulud npm supply chain attack","zh":"Shai-Hulud npm供应链攻击"},"url":"https://www.wiz.io/blog/shai-hulud-npm-supply-chain-attack","publisher":"Wiz","date":"2025-09-16","accessed":"2026-11-14"}]},{"id":"shai-hulud-2","name":{"en":"Shai-Hulud 2.0","zh":"Shai-Hulud 2.0"},"date":"2025-11-21","date_label":{"en":"Nov 2025","zh":"2025 年 11 月"},"title":{"en":"The second wave","zh":"第二波攻击"},"text":{"en":"A more aggressive version ran before installation even finished, disguised as a Bun installer. It stole environment variables, SSH keys, GitHub and npm tokens, build-pipeline variables and cloud credentials, and published them in public repositories. Check Point counted 621 infected npm packages, 25,000 compromised GitHub repositories and 14,206 leaked secrets, 2,485 of them still valid. If it could not steal credentials, it tried to wipe the user's home folder. Sources differ on the start: Check Point gives 21 to 23 November 2025, Unit 42 early November.","zh":"攻击性更强的新版本伪装成Bun安装程序，在安装尚未完成时就开始运行。它窃取环境变量、SSH密钥、GitHub和npm令牌、构建流水线变量以及云服务凭据，并发布到公开代码仓库。Check Point统计有621个npm软件包被感染、25,000个GitHub代码仓库被入侵、14,206个密钥被泄露，其中2,485个仍然有效。如果窃取凭据失败，它会尝试清空用户的主目录。各方对开始时间说法不一：Check Point称是 2025 年 11 月 21 日至 23 日，Unit 42称是11月上旬。"},"lesson":{"en":"These attacks come back and get worse. Keep the same controls on all the time: no unreviewed install scripts, lockfiles, a delay before new versions, and careful handling of keys.","zh":"这类攻击会卷土重来，而且愈演愈烈。同样的防护措施要一直保持：不运行未经审查的安装脚本、使用锁定文件（lockfile）、新版本发布后等一段时间再用，并妥善管理密钥。"},"sources":[{"title":{"en":"Shai-Hulud 2.0: Inside The Second Coming, the Most Aggressive NPM Supply Chain Attack of 2025","zh":"Shai-Hulud 2.0：剖析“第二次降临”，2025 年最具攻击性的npm供应链攻击"},"url":"https://blog.checkpoint.com/research/shai-hulud-2-0-inside-the-second-coming-the-most-aggressive-npm-supply-chain-attack-of-2025/","publisher":"Check Point Research","date":"2025-11-25","accessed":"2026-11-14"},{"title":{"en":"'Shai-Hulud' Worm Compromises npm Ecosystem in Supply Chain Attack (updated)","zh":"“Shai-Hulud”蠕虫通过供应链攻击入侵npm生态系统（更新版）"},"url":"https://unit42.paloaltonetworks.com/npm-supply-chain-attack/","publisher":"Palo Alto Networks Unit 42","date":"2025-11-25","accessed":"2026-11-14"}]}],"questions":[{"n":1,"id":"real","question":{"en":"Is it the real project?","zh":"这是真正的官方项目吗？"},"where_to_look":{"en":"The repository page: owner, web address, releases and latest commit. Then the LICENSE file itself.","zh":"代码仓库页面：所有者、网址、版本发布和最新提交。然后打开LICENSE文件本身。"},"check":{"en":"The owner and link match the official website. The account has a long history and recent releases. Read the LICENSE file itself: the licence field in package.json can say something different.","zh":"所有者和链接与官方网站一致；账号历史悠久，近期有发布新版本。请直接阅读LICENSE文件：package.json 中的许可证字段可能与之不符。"},"why":{"en":"A copy with a look-alike name can carry changed code. A fork can also fall behind the official project and miss security fixes.","zh":"名称相似的仿冒副本可能夹带被改动的代码。复刻也可能落后于官方项目，缺少安全修复。"},"safe":{"en":"Take the link from the official website, not from an ad or a video description. Prefer official releases, and confirm you have the latest one.","zh":"从官方网站获取链接，不要用广告或视频简介里的链接。优先使用官方发布版本，并确认是最新版本。"},"takeaway":{"en":"Read the LICENSE file itself, and always check the latest release.","zh":"直接阅读LICENSE文件，并始终查看最新发布版本。"},"lobehub":{"severity":"low","reason":{"en":"Genuine project and commit, but the licence information disagrees, and our copy is a fork that is already one release behind.","zh":"项目和提交都是真实的，但许可证信息前后不一致，而且我们的副本是复刻，已经落后一个版本。"},"finding":{"en":"Our copy is a fork, `helajo/lobehub`. Its latest commit, `f6f0de5` (11 Nov 2026), is version 2.3.2. The same commit also opens on the official `lobehub/lobehub` page, but GitHub shows fork commits there too, so this does not prove the official branch has it. package.json says the licence is \"MIT\", but the LICENSE file is the LobeHub Community License: Apache 2.0 with extra conditions, including a commercial licence to develop and distribute a derivative work. Version 2.3.3 came out on 12 Nov 2026, so 2.3.2 is no longer the latest.","zh":"我们的副本是复刻 `helajo/lobehub`。它的最新提交（`f6f0de5`，2026 年 11 月 11 日）对应版本2.3.2，该提交在官方 `lobehub/lobehub` 的页面上也能打开；但GitHub在官方页面上也会显示复刻中的提交，所以这并不能证明官方分支包含该提交。package.json 写的许可证是“MIT”，但LICENSE文件实际是LobeHub Community License（LobeHub社区许可证）：在Apache 2.0基础上附加条件，其中包括开发和分发衍生作品需要商业许可证。v2.3.3已于 2026 年 11 月 12 日发布，因此2.3.2已不是最新版本。"},"evidence":[{"file":"package.json","line":3,"note":{"en":"\"version\": \"2.3.2\"","zh":"版本号 \"2.3.2\""},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/package.json#L3"},{"file":"package.json","line":"21-24","note":{"en":"repository: https://github.com/lobehub/lobehub.git","zh":"代码仓库地址指向 https://github.com/lobehub/lobehub.git"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/package.json#L21-L24"},{"file":"package.json","line":25,"note":{"en":"\"license\": \"MIT\", which contradicts LICENSE","zh":"\"license\": \"MIT\"，与LICENSE文件矛盾"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/package.json#L25"},{"file":"LICENSE","line":1,"note":{"en":"LobeHub Community License","zh":"LobeHub Community License"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/LICENSE#L1"},{"file":"LICENSE","line":"7-22","note":{"en":"Apache 2.0 plus conditions (commercial licence for derivative works; the producer may change the licence)","zh":"Apache 2.0加附加条件（衍生作品需商业许可证；发布方可更改许可证）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/LICENSE#L7-L22"},{"file":"git log -1; git remote -v","line":null,"note":{"en":"HEAD f6f0de5, 11 Nov 2026; origin is the fork helajo/lobehub","zh":"HEAD为f6f0de5，2026 年 11 月 11 日；origin为复刻 helajo/lobehub"},"url":null}]},"sources":[{"title":{"en":"Commit f6f0de5 on lobehub/lobehub (the version we checked)","zh":"lobehub/lobehub 上的提交 f6f0de5（我们检查的版本）"},"url":"https://github.com/lobehub/lobehub/commit/f6f0de5d7dee51c495602b731e90e2ece47354bf","publisher":"GitHub","date":"2026-11-11","accessed":"2026-11-14"},{"title":{"en":"lobehub/lobehub releases (v2.3.3 marked Latest, 12 Nov 2026)","zh":"lobehub/lobehub 版本发布页（v2.3.3 标为最新，2026 年 11 月 12 日）"},"url":"https://github.com/lobehub/lobehub/releases","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"package.json at the checked commit","zh":"已检查提交中的 package.json"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/package.json","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"LICENSE (LobeHub Community License) at the checked commit","zh":"已检查提交中的LICENSE文件（LobeHub Community License）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/LICENSE","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"}]},{"n":2,"id":"process","question":{"en":"How does it handle security?","zh":"项目如何处理安全问题？"},"where_to_look":{"en":"SECURITY.md in the repository, and the Security tab → Advisories on GitHub.","zh":"代码仓库中的 SECURITY.md，以及GitHub上的Security标签页 → Advisories。"},"check":{"en":"Is there a private way to report bugs? Are problems published as advisories, and fixed? Which versions still get fixes?","zh":"有没有私下报告漏洞的渠道？发现的问题是否以安全公告形式发布并修复？哪些版本仍然获得修复？"},"why":{"en":"Every large project has bugs. One that publishes and fixes them is safer than one that stays quiet. An old advisory with no fix is a warning.","zh":"大型项目都会有漏洞。公开并修复漏洞的项目，比对漏洞避而不谈的项目更安全。长期未修复的安全公告则是警示。"},"safe":{"en":"Use the latest release and keep updating. Look at the Security tab again before each upgrade.","zh":"使用最新发布版本并持续更新。每次升级前再看一遍Security标签页。"},"takeaway":{"en":"Only the newest release gets fixes, so whoever installs it must keep it updated.","zh":"只有最新版本获得安全修复，因此安装的人必须持续更新。"},"lobehub":{"severity":"low","reason":{"en":"A clear private reporting channel and a record of publishing fixes. Only the newest release is patched and past bugs were serious, so self-hosters must keep updating.","zh":"有清晰的私下报告渠道，并有发布修复的记录。但只有最新版本获得修补，且过去的漏洞相当严重，自行部署的用户必须持续更新。"},"finding":{"en":"SECURITY.md asks for private reports through GitHub's \"Report a Vulnerability\" form, not public issues, and aims to acknowledge within 7 days and fix within 30. Only the latest 2.x release gets security fixes. The Security tab lists 15 published advisories from January 2024 to October 2026. They include three where a bug in chat content could take over the computer (XSS to RCE), one of them rated critical at 9.6 out of 10. All 15 have fixes at or below 2.3.2. We compared version numbers; we did not re-test the fixes.","zh":"SECURITY.md 要求通过GitHub的“Report a Vulnerability”（报告漏洞）表单私下报告，而不是在公开议题（issue）中提出，并承诺7天内回复、30天内修复。只有最新的2.x版本获得安全修复。Security标签页列出了 2024 年 1 月至 2026 年 10 月间发布的15条安全公告，其中3条属于聊天内容中的漏洞可被用来控制电脑的情况（从XSS到RCE），有一条被评为“严重”（Critical），评分9.6（满分10）。全部15条的修复版本都不高于2.3.2。我们只比对了版本号，没有重新测试这些修复。"},"evidence":[{"file":"SECURITY.md","line":"5-11","note":{"en":"Supported versions: only the latest 2.x; 1.x and 0.x not supported","zh":"支持的版本：仅最新的2.x；1.x和0.x不再支持"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/SECURITY.md#L5-L11"},{"file":"SECURITY.md","line":"17-19","note":{"en":"Report through the GitHub Security Advisory form, not public issues","zh":"通过GitHub安全公告表单报告，不要使用公开议题（issue）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/SECURITY.md#L17-L19"},{"file":"SECURITY.md","line":"23-25","note":{"en":"Acknowledge within 7 days; fix within 30 days","zh":"7天内回复；30天内修复"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/SECURITY.md#L23-L25"}],"advisories":[{"id":"GHSA-2g9j-v25c-4j97","cve":null,"published":"2026-10-17","severity_repo":"Moderate","fixed_in":"2.1.49","title":{"en":"Path traversal in file name leads to arbitrary file write and remote code execution","zh":"文件名路径穿越，可任意写入文件并远程执行代码"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-2g9j-v25c-4j97"},{"id":"GHSA-xmwj-c75x-6346","cve":"CVE-2026-54157","published":"2026-06-03","severity_repo":"Moderate","fixed_in":"2.1.57","title":{"en":"Unauthenticated SSRF in /webapi/proxy","zh":"/webapi/proxy 无需登录的服务器端请求伪造（SSRF）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-xmwj-c75x-6346"},{"id":"GHSA-5mwj-v5jw-5c97","cve":"CVE-2026-39411","published":"2026-04-08","severity_repo":"Moderate","fixed_in":"2.1.48","title":{"en":"Authentication bypass via forgeable X-lobe-chat-auth header","zh":"可伪造 X-lobe-chat-auth 请求头绕过身份验证"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-5mwj-v5jw-5c97"},{"id":"GHSA-xq4x-622m-q8fq","cve":"CVE-2026-42045","published":"2026-04-27","severity_repo":"Moderate (CVSS 6.2)","fixed_in":"2.1.48","title":{"en":"Cross-site scripting (XSS) escalates to remote code execution (RCE)","zh":"跨站脚本（XSS）升级为远程代码执行（RCE）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-xq4x-622m-q8fq"},{"id":"GHSA-wrrr-8jcv-wjf5","cve":"CVE-2026-23835","published":"2026-01-30","severity_repo":"Moderate","fixed_in":"1.143.3","title":{"en":"Improper authorization in presigned upload","zh":"预签名上传授权不当"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-wrrr-8jcv-wjf5"},{"id":"GHSA-j7xp-4mg9-x28r","cve":"CVE-2026-23522","published":"2026-01-19","severity_repo":"Low (CVSS 3.7)","fixed_in":"v2.0.0-next.193","title":{"en":"Cross-user file deletion in knowledge base file removal","zh":"知识库文件删除可删除其他用户的文件"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-j7xp-4mg9-x28r"},{"id":"GHSA-4gpc-rhpj-9443","cve":"CVE-2026-23733","published":"2026-01-17","severity_repo":"Critical (CVSS 9.6)","fixed_in":"v2.0.0-next.180","title":{"en":"Cross-site scripting (XSS) escalates to remote code execution (RCE)","zh":"跨站脚本（XSS）升级为远程代码执行（RCE）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-4gpc-rhpj-9443"},{"id":"GHSA-fgx4-p8xf-qhp9","cve":"CVE-2025-62505","published":"2025-10-17","severity_repo":"Low","fixed_in":"1.136.2","title":{"en":"SSRF with native web fetch module","zh":"内置网页抓取模块的服务器端请求伪造（SSRF）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-fgx4-p8xf-qhp9"},{"id":"GHSA-xph5-278p-26qx","cve":"CVE-2025-59426","published":"2025-09-24","severity_repo":"Moderate","fixed_in":"1.130.1","title":{"en":"Open redirect","zh":"开放重定向"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-xph5-278p-26qx"},{"id":"GHSA-m79r-r765-5f9j","cve":"CVE-2025-59417","published":"2025-09-18","severity_repo":"Moderate","fixed_in":"1.129.4","title":{"en":"Remote code execution via XSS in chat messages (desktop)","zh":"聊天消息中的XSS导致远程代码执行（桌面版）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-m79r-r765-5f9j"},{"id":"GHSA-2xcc-vm3f-m8rw","cve":"CVE-2024-32965","published":"2024-11-26","severity_repo":"High","fixed_in":"1.19.13","title":{"en":"SSRF vulnerability in lobe-chat","zh":"lobe-chat 服务器端请求伪造（SSRF）漏洞"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-2xcc-vm3f-m8rw"},{"id":"GHSA-3fc8-2r3f-8wrg","cve":"CVE-2024-47066","published":"2024-09-21","severity_repo":"Critical","fixed_in":"1.19.13","title":{"en":"Insufficient fix for an earlier /api/proxy SSRF","zh":"此前 /api/proxy SSRF漏洞修复不彻底"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-3fc8-2r3f-8wrg"},{"id":"GHSA-p36r-qxgx-jq2v","cve":"CVE-2024-37895","published":"2024-06-17","severity_repo":"Moderate","fixed_in":"0.162.25","title":{"en":"Unexpected API key leak","zh":"API密钥意外泄露"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-p36r-qxgx-jq2v"},{"id":"GHSA-mxhq-xw3g-rphc","cve":"CVE-2024-32964","published":"2024-05-10","severity_repo":"Critical","fixed_in":"0.150.6","title":{"en":"/api/proxy endpoint SSRF vulnerability","zh":"/api/proxy 接口服务器端请求伪造（SSRF）漏洞"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-mxhq-xw3g-rphc"},{"id":"GHSA-pf55-fj96-xf37","cve":"CVE-2024-24566","published":"2024-01-31","severity_repo":"Moderate","fixed_in":"0.122.4","title":{"en":"Unauthorized access to chat plugins","zh":"未经授权即可使用聊天插件"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-pf55-fj96-xf37"}]},"sources":[{"title":{"en":"SECURITY.md at the checked commit","zh":"已检查提交中的 SECURITY.md"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/SECURITY.md","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"lobehub/lobehub security advisories","zh":"lobehub/lobehub 安全公告"},"url":"https://github.com/lobehub/lobehub/security/advisories","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"lobehub/lobehub security advisories, page 2","zh":"lobehub/lobehub 安全公告（第2页）"},"url":"https://github.com/lobehub/lobehub/security/advisories?page=2","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GHSA-2g9j-v25c-4j97: Path traversal in file name leads to arbitrary file write and remote code execution","zh":"GHSA-2g9j-v25c-4j97：文件名路径穿越，可任意写入文件并远程执行代码"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-2g9j-v25c-4j97","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2026-10-17","accessed":"2026-11-14"},{"title":{"en":"GHSA-xmwj-c75x-6346: Unauthenticated SSRF in /webapi/proxy","zh":"GHSA-xmwj-c75x-6346：/webapi/proxy 无需登录的服务器端请求伪造（SSRF）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-xmwj-c75x-6346","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2026-06-03","accessed":"2026-11-14"},{"title":{"en":"GHSA-5mwj-v5jw-5c97: Authentication bypass via forgeable X-lobe-chat-auth header","zh":"GHSA-5mwj-v5jw-5c97：可伪造 X-lobe-chat-auth 请求头绕过身份验证"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-5mwj-v5jw-5c97","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2026-04-08","accessed":"2026-11-14"},{"title":{"en":"GHSA-xq4x-622m-q8fq: Cross-site scripting (XSS) escalates to remote code execution (RCE)","zh":"GHSA-xq4x-622m-q8fq：跨站脚本（XSS）升级为远程代码执行（RCE）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-xq4x-622m-q8fq","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2026-04-27","accessed":"2026-11-14"},{"title":{"en":"GHSA-wrrr-8jcv-wjf5: Improper authorization in presigned upload","zh":"GHSA-wrrr-8jcv-wjf5：预签名上传授权不当"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-wrrr-8jcv-wjf5","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2026-01-30","accessed":"2026-11-14"},{"title":{"en":"GHSA-j7xp-4mg9-x28r: Cross-user file deletion in knowledge base file removal","zh":"GHSA-j7xp-4mg9-x28r：知识库文件删除可删除其他用户的文件"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-j7xp-4mg9-x28r","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2026-01-19","accessed":"2026-11-14"},{"title":{"en":"GHSA-4gpc-rhpj-9443: Cross-site scripting (XSS) escalates to remote code execution (RCE)","zh":"GHSA-4gpc-rhpj-9443：跨站脚本（XSS）升级为远程代码执行（RCE）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-4gpc-rhpj-9443","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2026-01-17","accessed":"2026-11-14"},{"title":{"en":"GHSA-fgx4-p8xf-qhp9: SSRF with native web fetch module","zh":"GHSA-fgx4-p8xf-qhp9：内置网页抓取模块的服务器端请求伪造（SSRF）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-fgx4-p8xf-qhp9","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2025-10-17","accessed":"2026-11-14"},{"title":{"en":"GHSA-xph5-278p-26qx: Open redirect","zh":"GHSA-xph5-278p-26qx：开放重定向"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-xph5-278p-26qx","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2025-09-24","accessed":"2026-11-14"},{"title":{"en":"GHSA-m79r-r765-5f9j: Remote code execution via XSS in chat messages (desktop)","zh":"GHSA-m79r-r765-5f9j：聊天消息中的XSS导致远程代码执行（桌面版）"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-m79r-r765-5f9j","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2025-09-18","accessed":"2026-11-14"},{"title":{"en":"GHSA-2xcc-vm3f-m8rw: SSRF vulnerability in lobe-chat","zh":"GHSA-2xcc-vm3f-m8rw：lobe-chat 服务器端请求伪造（SSRF）漏洞"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-2xcc-vm3f-m8rw","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2024-11-26","accessed":"2026-11-14"},{"title":{"en":"GHSA-3fc8-2r3f-8wrg: Insufficient fix for an earlier /api/proxy SSRF","zh":"GHSA-3fc8-2r3f-8wrg：此前 /api/proxy SSRF漏洞修复不彻底"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-3fc8-2r3f-8wrg","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2024-09-21","accessed":"2026-11-14"},{"title":{"en":"GHSA-p36r-qxgx-jq2v: Unexpected API key leak","zh":"GHSA-p36r-qxgx-jq2v：API密钥意外泄露"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-p36r-qxgx-jq2v","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2024-06-17","accessed":"2026-11-14"},{"title":{"en":"GHSA-mxhq-xw3g-rphc: /api/proxy endpoint SSRF vulnerability","zh":"GHSA-mxhq-xw3g-rphc：/api/proxy 接口服务器端请求伪造（SSRF）漏洞"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-mxhq-xw3g-rphc","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2024-05-10","accessed":"2026-11-14"},{"title":{"en":"GHSA-pf55-fj96-xf37: Unauthorized access to chat plugins","zh":"GHSA-pf55-fj96-xf37：未经授权即可使用聊天插件"},"url":"https://github.com/lobehub/lobehub/security/advisories/GHSA-pf55-fj96-xf37","publisher":"GitHub (lobehub/lobehub security advisories)","date":"2024-01-31","accessed":"2026-11-14"}]},{"n":3,"id":"install","question":{"en":"What runs when I install it?","zh":"安装时会运行什么？"},"where_to_look":{"en":"package.json (scripts such as preinstall, postinstall and prepare), the package manager's settings file (for pnpm: pnpm-workspace.yaml), and whether a lockfile is in the repository.","zh":"package.json（preinstall、postinstall、prepare等脚本）、包管理器的设置文件（pnpm为 pnpm-workspace.yaml），以及代码仓库中是否有锁定文件（lockfile）。"},"check":{"en":"Which packages may run their own scripts during install, and whether a lockfile pins exact versions.","zh":"哪些软件包在安装时可以运行自己的脚本，以及是否有锁定文件（lockfile）固定确切版本。"},"why":{"en":"This is a supply-chain attack's favourite door. One hijacked library, and its install script runs as you, as in Shai-Hulud.","zh":"这是供应链攻击最常用的入口。只要一个库被劫持，它的安装脚本就会以你的身份运行，Shai-Hulud就是这样传播的。"},"safe":{"en":"Use the hosted app or the official desktop release instead of building. If you must build, do it in a separate virtual machine, never on a work laptop.","zh":"使用托管版应用或官方桌面版，不要自行构建。如果必须构建，请在单独的虚拟机中进行，切勿在工作电脑上进行。"},"takeaway":{"en":"No lockfile means two installs can get different code.","zh":"没有锁定文件（lockfile），两次安装得到的代码可能不同。"},"lobehub":{"severity":"medium","reason":{"en":"Install scripts are allow-listed, which is good. But with no lockfile for 421 direct dependencies, a freshly hijacked version can arrive on install, and the prepare script quietly sets up the project's git hooks.","zh":"安装脚本采用了允许清单，这一点很好。但421个直接依赖没有锁定文件（lockfile），刚被劫持的版本可能在安装时被拉取进来，而且prepare脚本会悄悄启用项目自带的git钩子。"},"finding":{"en":"There is no lockfile for the main app (`lockfile: false` in pnpm-workspace.yaml), and each install takes the newest versions allowed for 421 direct dependencies, so two installs can get different code. Install scripts are allow-listed: 6 packages may run them and 7 are blocked. pnpm's default 1-day wait for brand-new versions applies, but `@lobehub/*` packages are exempt. The `prepare` script switches on the project's own git hooks, which then run on every commit. The desktop app, by contrast, has its own lockfile.","zh":"主应用没有锁定文件（lockfile）：pnpm-workspace.yaml 中设为 `lockfile: false`。每次安装都会为421个直接依赖选取允许范围内的最新版本，因此两次安装得到的代码可能不同。安装脚本采用允许清单：6个软件包可以运行脚本，7个被禁止。pnpm默认要求新版本发布满1天后才会安装，但 `@lobehub/*` 软件包不受此限制。`prepare` 脚本会启用项目自带的git钩子，此后每次提交都会运行。相比之下，桌面应用有自己的锁定文件。"},"evidence":[{"file":"pnpm-workspace.yaml","line":1,"note":{"en":"lockfile: false","zh":"lockfile: false（不使用锁定文件）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/pnpm-workspace.yaml#L1"},{"file":"pnpm-workspace.yaml","line":2,"note":{"en":"resolutionMode: highest (newest allowed versions)","zh":"resolutionMode: highest（取允许范围内的最新版本）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/pnpm-workspace.yaml#L2"},{"file":"pnpm-workspace.yaml","line":"30-41","note":{"en":"minimumReleaseAgeExclude, including '@lobehub/*'","zh":"minimumReleaseAgeExclude，包括 '@lobehub/*'"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/pnpm-workspace.yaml#L30-L41"},{"file":"pnpm-workspace.yaml","line":"50-63","note":{"en":"allowBuilds: 6 allowed, 7 blocked","zh":"allowBuilds：6个允许，7个禁止"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/pnpm-workspace.yaml#L50-L63"},{"file":"package.json","line":114,"note":{"en":"prepare: git config core.hooksPath .githooks","zh":"prepare：git config core.hooksPath .githooks"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/package.json#L114"},{"file":".githooks/pre-commit","line":"13-16","note":{"en":"Runs lint-staged and a bun script on every commit","zh":"每次提交都运行lint-staged和一个bun脚本"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/.githooks/pre-commit#L13-L16"},{"file":"apps/desktop/pnpm-workspace.yaml","line":33,"note":{"en":"Desktop app: lockfile: true","zh":"桌面应用：lockfile: true"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/apps/desktop/pnpm-workspace.yaml#L33"}]},"sources":[{"title":{"en":"pnpm-workspace.yaml at the checked commit","zh":"已检查提交中的 pnpm-workspace.yaml"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/pnpm-workspace.yaml","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"package.json at the checked commit","zh":"已检查提交中的 package.json"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/package.json","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"pnpm settings: Build (allowBuilds, strictDepBuilds)","zh":"pnpm设置：Build（allowBuilds、strictDepBuilds）"},"url":"https://pnpm.io/settings/build","publisher":"pnpm","date":null,"accessed":"2026-11-14"},{"title":{"en":"pnpm settings: Dependency resolution (minimumReleaseAge)","zh":"pnpm设置：依赖解析（minimumReleaseAge）"},"url":"https://pnpm.io/settings/dependency-resolution","publisher":"pnpm","date":null,"accessed":"2026-11-14"}]},{"n":4,"id":"scripts","question":{"en":"Does it run downloaded scripts?","zh":"是否会运行下载的脚本？"},"where_to_look":{"en":"The README's install or quick-start section, and the setup docs.","zh":"README中的安装或快速上手部分，以及安装部署文档。"},"check":{"en":"Any line that sends a download straight into a shell such as bash, for example `curl … | bash` or `bash <(curl …)`.","zh":"任何把下载内容直接交给bash等命令行程序执行的命令，例如 `curl … | bash` 或 `bash <(curl …)`。"},"why":{"en":"You cannot read the script before it runs, and a short link can be pointed somewhere else at any time.","zh":"脚本运行前你无法阅读它，而且短链接随时可能被改为指向别处。"},"safe":{"en":"Download the script, read it or ask Claude to, then run your saved copy, not whatever the link serves that day.","zh":"先下载脚本，自己阅读或请Claude阅读，然后运行你保存的那一份，而不是链接当天提供的内容。"},"takeaway":{"en":"Save it, read it, then run it.","zh":"先保存，再阅读，然后运行。"},"code":"bash <(curl -fsSL https://lobe.li/setup.sh) -l en","lobehub":{"severity":"medium","reason":{"en":"It runs an unpinned, unreviewed script through a third-party short link. The script can be read in the repository, but what runs is whatever the link points to that day.","zh":"它通过第三方短链接运行一个未固定版本、未经审查的脚本。脚本虽然可以在代码仓库中阅读，但实际运行的是链接当天指向的内容。"},"finding":{"en":"The README's one-line setup is `bash <(curl -fsSL https://lobe.li/setup.sh) -l en`. The short link redirects to the setup script on the default branch of `lobehub/lobehub`, so it runs whatever is there on the day: no pinned version and no checksum. The script then downloads more files from the main branch, also unpinned. On the plus side, the script can be read in the repository (`docker-compose/setup.sh`, 862 lines) and does not need administrator (root) rights.","zh":"README中的一行安装命令是 `bash <(curl -fsSL https://lobe.li/setup.sh) -l en`。该短链接会跳转到 `lobehub/lobehub` 默认分支上的安装脚本，所以运行的是当天该分支上的内容：没有固定版本，也没有校验值。脚本随后还会从main分支下载更多文件，同样没有固定版本。好的一面是，脚本可以在代码仓库中阅读（`docker-compose/setup.sh`，共862行），而且不需要管理员（root）权限。"},"evidence":[{"file":"README.md","line":289,"note":{"en":"bash <(curl -fsSL https://lobe.li/setup.sh) -l en","zh":"bash <(curl -fsSL https://lobe.li/setup.sh) -l en"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/README.md#L289"},{"file":"README.zh-CN.md","line":284,"note":{"en":"Same command with -l zh_CN","zh":"相同命令，参数为 -l zh_CN"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/README.zh-CN.md#L284"},{"file":"docs/self-hosting/platform/docker-compose.mdx","line":50,"note":{"en":"Same command in the docs","zh":"文档中的相同命令"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docs/self-hosting/platform/docker-compose.mdx#L50"},{"file":"docker-compose/setup.sh","line":28,"note":{"en":"SOURCE_URL points at the main branch (unpinned)","zh":"SOURCE_URL 指向main分支（未固定版本）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/setup.sh#L28"},{"file":"docker-compose/setup.sh","line":"557-567","note":{"en":"Downloads the compose file, settings and bucket policy","zh":"下载compose文件、设置文件和存储桶策略"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/setup.sh#L557-L567"},{"file":"lobe.li/setup.sh","line":null,"note":{"en":"Network check on 14 Nov 2026: redirects (302) to the script on the default branch (HEAD)","zh":"2026 年 11 月 14 日网络检查：跳转（302）到默认分支（HEAD）上的脚本"},"url":null}]},"sources":[{"title":{"en":"README.md (one-line setup) at the checked commit","zh":"已检查提交中的 README.md（一行安装命令）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/README.md#L289","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"docker-compose/setup.sh at the checked commit","zh":"已检查提交中的 docker-compose/setup.sh"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/setup.sh","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"}]},{"n":5,"id":"secrets","question":{"en":"Are there secrets in the code?","zh":"代码里有没有密钥？"},"where_to_look":{"en":"Example and sample files: .env.example, docker-compose files, seed data such as init_data.json, and config folders.","zh":"示例文件：.env.example、docker-compose 文件、init_data.json 等初始数据文件，以及配置文件夹。"},"check":{"en":"Keys, tokens and passwords written into files, including files labelled example or sample, and passwords that every install shares.","zh":"写在文件里的密钥、令牌和密码，包括标为example或sample的示例文件，以及所有安装共用的密码。"},"why":{"en":"On a server that uses them unchanged, anyone can sign in or forge logins. Once pushed to GitHub, a secret stays in the history and in every copy, so it must be replaced, not just deleted.","zh":"如果服务器原样使用这些密钥，任何人都可以登录或伪造登录凭证。密钥一旦推送到GitHub，就会留在历史记录和每一份副本中，所以必须更换，仅删除是不够的。"},"safe":{"en":"Never reuse sample keys or passwords; generate your own. Before we push our own code, ask Claude to scan it for secrets, and keep GitHub push protection on.","zh":"切勿沿用示例密钥或密码，请自行生成。推送我们自己的代码之前，先请Claude扫描其中是否有密钥，并保持GitHub推送保护处于开启状态。"},"takeaway":{"en":"\"Sample\" files can hold real secrets. Check what others left, and what we push.","zh":"“示例”文件里也可能有真实密钥。既要检查别人留下的，也要检查我们推送的。"},"code":"docker-compose/production/grafana/init_data.json","lobehub":{"severity":"high","reason":{"en":"A published signing key and admin / pswd123 in a ready-to-run setup, plus a database password shared by every default install: anyone who uses the files unchanged is open to forged logins or sign-in with known passwords.","zh":"现成可运行的配置中公开了签名私钥和admin / pswd123，所有默认安装还共用同一个数据库密码：原样使用这些文件的人，可能被伪造登录凭证，或被人用已知密码登录。"},"finding":{"en":"A ready-made data file for the login service (Casdoor), which one of the Docker setups loads, holds a real private key that signs logins, two app secrets, and the accounts admin and user, both with the password pswd123. The example settings for the Docker setup ship a fixed database password, and the setup script never changes it, so every default install shares it. The storage admin key is admin, and when the script generates a storage secret it is only 8 characters long. A start-up container prints the storage keys to its log. We did not copy any key material.","zh":"某个Docker部署会加载登录服务（Casdoor）的一个现成数据文件，其中包含一把用于签发登录凭证的真实私钥、两个应用密钥，以及admin和user两个账号，密码都是pswd123。Docker部署的示例设置自带一个固定的数据库密码，而安装脚本从不更换它，因此所有默认安装共用同一个密码。存储服务的管理员账号是admin；脚本生成的存储密钥只有8个字符。一个启动容器还会把存储密钥打印到日志中。我们没有复制任何密钥内容。"},"evidence":[{"file":"docker-compose/production/grafana/init_data.json","line":592,"note":{"en":"Private key for signing logins (JWT, RS256); not copied","zh":"登录凭证签名私钥（JWT，RS256），未复制"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/production/grafana/init_data.json#L592"},{"file":"docker-compose/production/grafana/init_data.json","line":"343, 552","note":{"en":"Two OAuth app secrets; not copied","zh":"两个OAuth应用密钥，未复制"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/production/grafana/init_data.json#L343"},{"file":"docker-compose/production/grafana/init_data.json","line":"1522, 1529","note":{"en":"User admin, password pswd123, administrator","zh":"用户admin，密码pswd123，管理员权限"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/production/grafana/init_data.json#L1522"},{"file":"docker-compose/production/grafana/init_data.json","line":"1365, 1372","note":{"en":"User user, password pswd123","zh":"用户user，密码pswd123"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/production/grafana/init_data.json#L1365"},{"file":"docker-compose/deploy/.env.example","line":40,"note":{"en":"Fixed POSTGRES_PASSWORD, the same for every install","zh":"固定的 POSTGRES_PASSWORD，所有安装相同"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/.env.example#L40"},{"file":"docker-compose/deploy/.env.example","line":"44-45","note":{"en":"RUSTFS_ACCESS_KEY=admin","zh":"RUSTFS_ACCESS_KEY=admin"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/.env.example#L44-L45"},{"file":"docker-compose/setup.sh","line":"676-740","note":{"en":"Regenerates some secrets, never the database password","zh":"会重新生成部分密钥，但从不更换数据库密码"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/setup.sh#L676-L740"},{"file":"docker-compose/setup.sh","line":710,"note":{"en":"Storage secret generated as 8 hex characters","zh":"存储密钥仅生成8个十六进制字符"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/setup.sh#L710"},{"file":"docker-compose/deploy/docker-compose.yml","line":160,"note":{"en":"rustfs-init prints the storage keys to the container log","zh":"rustfs-init 把存储密钥打印到容器日志"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/docker-compose.yml#L160"}]},"sources":[{"title":{"en":"docker-compose/production/grafana/init_data.json at the checked commit","zh":"已检查提交中的 docker-compose/production/grafana/init_data.json"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/production/grafana/init_data.json","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"docker-compose/deploy/.env.example at the checked commit","zh":"已检查提交中的 docker-compose/deploy/.env.example"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/.env.example","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"docker-compose/setup.sh at the checked commit","zh":"已检查提交中的 docker-compose/setup.sh"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/setup.sh","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"docker-compose/deploy/docker-compose.yml at the checked commit","zh":"已检查提交中的 docker-compose/deploy/docker-compose.yml"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/docker-compose.yml","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"GitHub Docs: Removing sensitive data from a repository","zh":"GitHub文档：从代码仓库中删除敏感数据"},"url":"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository","publisher":"GitHub","date":null,"accessed":"2026-11-14"},{"title":{"en":"GitHub Docs: About push protection","zh":"GitHub文档：关于推送保护"},"url":"https://docs.github.com/en/code-security/secret-scanning/introduction/about-push-protection","publisher":"GitHub","date":null,"accessed":"2026-11-14"}]},{"n":6,"id":"exposed","question":{"en":"What's exposed when it runs?","zh":"运行时会暴露什么？"},"where_to_look":{"en":"docker-compose.yml (the ports: lines), .env.example (sign-up and password settings), and storage or bucket policy files.","zh":"docker-compose.yml（ports: 那几行）、.env.example（注册和密码设置），以及存储或存储桶策略文件。"},"check":{"en":"Which ports it opens and to whom, default passwords, whether storage is public, and who is allowed to sign up.","zh":"开放哪些端口、对谁开放，默认密码，存储是否公开，以及谁可以注册。"},"why":{"en":"A port is a door into your computer. Attackers use internet search tools such as Shodan and Censys to find systems with open ports, default passwords and old software (CISA). A port open on every network can also be reached by other devices on the same office or café Wi-Fi.","zh":"端口是进入电脑的一扇门。攻击者会用Shodan、Censys等互联网搜索工具，寻找开放端口、使用默认密码或软件过时的系统（CISA）。对所有网络开放的端口，同一办公室或咖啡馆Wi-Fi上的其他设备也可能连接得到。"},"safe":{"en":"Bind ports to 127.0.0.1 (this computer only), or remove the database and Redis port lines, which the compose file itself calls optional. Set your own passwords, and limit sign-up to your team's emails with AUTH_ALLOWED_EMAILS.","zh":"把端口绑定到127.0.0.1（仅本机可访问），或删除数据库和Redis的端口配置行，compose文件本身也注明这些是可选的。设置自己的密码，并用 AUTH_ALLOWED_EMAILS 把注册限制为团队成员的邮箱。"},"takeaway":{"en":"Default settings are for a demo, not for your laptop.","zh":"默认设置是给演示用的，不适合直接用在你的电脑上。"},"lobehub":{"severity":"high","reason":{"en":"The database and a Redis with no password are open on all networks, with a publicly known database password and open sign-up, on a server that can hold API keys and run agents.","zh":"数据库和无密码的Redis对所有网络开放，数据库密码已公开，任何人都能注册，而这台服务器可能存有API密钥并运行智能体。"},"finding":{"en":"The default Docker setup publishes the database (PostgreSQL, port 5432), Redis (port 6379), file storage (ports 9000 and 9001), the app (3210) and two gateways (8787 and 8788) on every network the computer joins. Redis has no password, and the database uses the password printed in the repository. The storage bucket lets anyone read files. Sign-up is open to any email address. One good sign: the search database (Elasticsearch) is deliberately kept private.","zh":"默认的Docker配置会在电脑接入的所有网络上开放数据库（PostgreSQL，端口5432）、Redis（端口6379）、文件存储（端口9000和9001）、应用本身（3210）以及两个网关（8787和8788）。Redis没有密码，数据库使用的是代码仓库中公开的密码。存储桶允许任何人读取文件。任何邮箱都可以注册。好的一面是：搜索数据库（Elasticsearch）有意没有对外开放。"},"evidence":[{"file":"docker-compose/deploy/docker-compose.yml","line":"79-80","note":{"en":"PostgreSQL '5432:5432' on all interfaces","zh":"PostgreSQL '5432:5432'，对所有网络开放"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/docker-compose.yml#L79-L80"},{"file":"docker-compose/deploy/docker-compose.yml","line":"109-111","note":{"en":"Redis '6379:6379'; no password set","zh":"Redis '6379:6379'，未设密码"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/docker-compose.yml#L109-L111"},{"file":"docker-compose/deploy/docker-compose.yml","line":34,"note":{"en":"REDIS_URL has no password","zh":"REDIS_URL 不含密码"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/docker-compose.yml#L34"},{"file":"docker-compose/deploy/docker-compose.yml","line":"126-128","note":{"en":"File storage ports 9000 and 9001","zh":"文件存储端口9000和9001"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/docker-compose.yml#L126-L128"},{"file":"docker-compose/deploy/docker-compose.yml","line":"61-63","note":{"en":"Gateway ports 8787 and 8788","zh":"网关端口8787和8788"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/docker-compose.yml#L61-L63"},{"file":"docker-compose/deploy/docker-compose.yml","line":"207-208","note":{"en":"Elasticsearch: 'Never publish 9200' (good)","zh":"Elasticsearch：“Never publish 9200”（做法正确）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/docker-compose.yml#L207-L208"},{"file":"docker-compose/deploy/bucket.config.json","line":"1-18","note":{"en":"Anyone may read files in the bucket","zh":"任何人都可读取存储桶中的文件"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/bucket.config.json#L1-L18"},{"file":"docker-compose/deploy/.env.example","line":"5-12","note":{"en":"AUTH_ALLOWED_EMAILS commented out: 'Leave empty to allow all users to register'","zh":"AUTH_ALLOWED_EMAILS 被注释掉：“Leave empty to allow all users to register”（留空即允许所有人注册）"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/.env.example#L5-L12"},{"file":"src/libs/better-auth/plugins/email-whitelist.ts","line":23,"note":{"en":"An empty list allows every email","zh":"列表为空时允许所有邮箱"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/src/libs/better-auth/plugins/email-whitelist.ts#L23"}]},"sources":[{"title":{"en":"docker-compose/deploy/docker-compose.yml at the checked commit","zh":"已检查提交中的 docker-compose/deploy/docker-compose.yml"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/docker-compose.yml","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"docker-compose/deploy/bucket.config.json at the checked commit","zh":"已检查提交中的 docker-compose/deploy/bucket.config.json"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/bucket.config.json","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"docker-compose/deploy/.env.example at the checked commit","zh":"已检查提交中的 docker-compose/deploy/.env.example"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/docker-compose/deploy/.env.example","publisher":"GitHub (lobehub/lobehub)","date":"2026-11-11","accessed":"2026-11-11"},{"title":{"en":"CISA: Internet Exposure Reduction Guidance","zh":"CISA：减少互联网暴露面指南"},"url":"https://www.cisa.gov/resources-tools/resources/stuff-search","publisher":"CISA","date":"2026-08-21","accessed":"2026-11-14"}]},{"n":7,"id":"power","question":{"en":"What can it do on my machine?","zh":"它能在我的电脑上做什么？"},"where_to_look":{"en":"Tool and plugin settings in the docs, the approval settings, and the .github/workflows folder (automations that come with a fork).","zh":"文档中的工具和插件设置、审批设置，以及 .github/workflows 文件夹（随复刻一起带来的自动化流程）。"},"check":{"en":"Can it read and write files, run commands or install plugins without asking? Which approval mode is the default? What automations come with the fork?","zh":"它能否不经询问就读写文件、运行命令或安装插件？默认是哪种审批模式？复刻会带来哪些自动化流程？"},"why":{"en":"An AI agent that writes files and runs commands acts as you. One bad plugin or a hostile instruction hidden in content, and an attacker does too. Past LobeHub bugs let a malicious chat message or diagram run commands on the computer; all are fixed.","zh":"能写文件、运行命令的AI智能体是以你的身份行事的。一个恶意插件，或藏在内容里的恶意指令，就能让攻击者也以你的身份行事。LobeHub过去的漏洞曾让恶意聊天消息或图表在电脑上运行命令，现均已修复。"},"safe":{"en":"Keep approvals on: Manual mode, and Ask for new plugin tools. Give the agent one working folder. Add plugins (MCP servers) only from sources you trust. Leave GitHub Actions off on your fork.","zh":"保持审批开启：使用手动（Manual）模式，新插件工具设为询问（Ask）。只给智能体一个工作文件夹。只从可信来源添加插件（MCP服务器）。在你的复刻上保持GitHub Actions关闭。"},"takeaway":{"en":"Never switch an agent to approve everything on your own laptop.","zh":"切勿在自己的电脑上把智能体设为自动批准一切。"},"lobehub":{"severity":"medium","reason":{"en":"Shell commands ask first, but file reads and writes in the working folder do not, auto-run removes all prompts, local plugins are programs that run on your computer, and a fork with Actions on pulls in upstream changes every 6 hours.","zh":"运行命令前会先询问，但读写工作文件夹内的文件不会；自动运行模式会取消所有询问；本地插件是在你电脑上运行的程序；开启Actions的复刻每6小时会拉取一次上游更新。"},"finding":{"en":"The desktop app's Local System tool can read, write and move files and run shell commands. Shell commands need your approval by default, but reading and writing files inside the working folder does not, and the auto-run mode approves everything without asking. LobeHub's own docs warn that not every write operation is guaranteed to ask. Plugin tools (MCP) can be set to Allow, Ask or Deny; a local MCP server is a program running on your computer. The repository carries 32 GitHub workflows. One of them, Upstream Sync, runs only in forks: if Actions are on, it pulls the official main branch into your fork every 6 hours.","zh":"桌面应用的Local System（本地系统）工具可以读取、写入和移动文件，并运行命令。运行命令默认需要你批准，但读写工作文件夹内的文件不需要；auto-run（自动运行）模式则会不经询问批准一切。LobeHub自己的文档也提醒：并非每个写入操作都一定会请求批准。插件工具（MCP）可以设为Allow（允许）、Ask（询问）或Deny（拒绝）；本地MCP服务器就是在你电脑上运行的程序。代码仓库带有32个GitHub工作流，其中Upstream Sync只在复刻中运行：如果开启了Actions，它每6小时会把官方main分支拉取到你的复刻中。"},"evidence":[{"file":"packages/builtin-tool-local-system/src/manifest.ts","line":242,"note":{"en":"runCommand: approval required","zh":"runCommand：需要批准"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/packages/builtin-tool-local-system/src/manifest.ts#L242"},{"file":"packages/builtin-tool-local-system/src/manifest.ts","line":"21-27","note":{"en":"File tools: no prompt inside the working folder","zh":"文件类工具：在工作文件夹内不询问"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/packages/builtin-tool-local-system/src/manifest.ts#L21-L27"},{"file":"packages/builtin-tool-local-system/src/interventionAudit.ts","line":"4-31","note":{"en":"Paths inside the working folder (and /tmp) pass without approval","zh":"工作文件夹（以及 /tmp）内的路径无需批准"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/packages/builtin-tool-local-system/src/interventionAudit.ts#L4-L31"},{"file":"packages/types/src/tool/intervention.ts","line":"136-144","note":{"en":"Approval modes: auto-run, allow-list, manual, headless","zh":"审批模式：auto-run、allow-list、manual、headless"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/packages/types/src/tool/intervention.ts#L136-L144"},{"file":"apps/server/src/services/aiAgent/foregroundIntervention.ts","line":22,"note":{"en":"Default approval mode: manual","zh":"默认审批模式：manual"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/apps/server/src/services/aiAgent/foregroundIntervention.ts#L22"},{"file":"src/libs/mcp/client.ts","line":"262-267","note":{"en":"A local MCP server is started as a program on your computer","zh":"本地MCP服务器作为程序在你的电脑上启动"},"url":"https://github.com/lobehub/lobehub/blob/f6f0de5d7dee51c495602b731e90e2ece47354bf/src/libs/mcp/client.ts#L262-L267"},{"file":".github/workflows/sync.yml","line":"1-30","note":{"en":"Upstream Sync: every 6 hours, forks only, with write access","zh":"Upstream Sync：每6小时一
